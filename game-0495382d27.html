000;box-shadow:inset 0 0 0 2px var(--cyan),4px 4px 0 #000;padding:10px 12px;display:none;font-size:13px;line-height:1.45}#tip.on{display:block;animation:pop .2s steps(3)}#tip.top{bottom:auto;top:calc(64px + var(--sat))}#tip b{display:block;color:var(--cyan);margin-bottom:4px}#tip ul{margin:0 0 8px;padding-left:18px}#tip .btn{padding:8px}.namein{display:block;width:100%;background:#000;color:var(--yel);border:3px solid #000;box-shadow:inset 0 0 0 2px var(--yel);padding:12px;font:bold 20px "Lucida Console","Courier New",monospace;text-align:center;text-transform:uppercase;letter-spacing:2px;user-select:text;-webkit-user-select:text;outline:none}.namein:focus{box-shadow:inset 0 0 0 2px #fff}.heroname{display:block;image-rendering:pixelated;image-rendering:crisp-edges;margin-bottom:6px}</style>
</head>
<body>
<div id="app">
  <!-- TITLE -->
  <div id="scr-title" class="screen on">
    <canvas id="titleCv" width="320" height="180"></canvas>
    <div class="logo"><div class="a">УЛИЧНЫЙ<br>ЧЕМПИОН</div><div class="b">КАРЬЕРА</div></div>
    <div class="menu">
      <button class="btn red" id="btnContinue" data-act="continue">Продолжить</button>
      <button class="btn grn" data-act="newgame">Новая карьера</button>
      <button class="btn" data-act="help">Как играть</button>
      <button class="btn" data-act="sound" id="btnSound">Звук: вкл</button>
      <button class="btn" data-act="vibro" id="btnVibro" style="display:none">Вибрация: вкл</button>
    </div>
    <div class="foot">5 районов · 50 боссов · 500 волн · 1 пояс<br><span id="build"></span><div id="saveInfo"></div></div>
  </div>

  <!-- HUB -->
  <div id="scr-hub" class="screen">
    <div class="top" id="topbar"></div>
    <div class="scroll" id="tabBody"></div>
    <div id="fightbar"></div>
    <nav class="nav" id="nav">
      <button data-act="tab" data-v="fighter"><span class="ic">🥊</span>Боец<i class="dot"></i></button>
      <button data-act="tab" data-v="gym"><span class="ic">🏋</span>Зал<i class="dot"></i></button>
      <button data-act="tab" data-v="moves"><span class="ic">👊</span>Приёмы<i class="dot"></i></button>
      <button data-act="tab" data-v="league"><span class="ic">🏆</span>Этапы<i class="dot"></i></button>
    </nav>
  </div>

  <!-- FIGHT -->
  <div id="scr-fight" class="screen">
    <div class="hud">
      <div class="side"><div class="nmrow"><canvas class="nm" id="pName" width="10" height="10"></canvas></div><canvas class="face" id="pFace" width="56" height="56"></canvas><div class="sb"><div class="bar hp" id="pHpBar"><i class="ghost" id="pGhost"></i><i class="fill" id="pHp"></i><b class="num" id="pHpN"></b></div><div class="bar st"><i class="fill" id="pSt"></i><b class="num" id="pStN"></b></div></div></div>
      <div class="ftimer"><small id="fRound">ВОЛНА</small><span id="fTimer">30</span></div>
      <div class="side r"><div class="nmrow"><canvas class="nm" id="oName" width="10" height="10"></canvas></div><div class="sb"><div class="bar hp" id="oHpBar"><i class="ghost" id="oGhost"></i><i class="fill" id="oHp"></i><b class="num" id="oHpN"></b></div><div class="bar st"><i class="fill" id="oSt"></i><b class="num" id="oStN"></b></div></div><canvas class="face" id="oFace" width="30" height="30"></canvas></div>
    </div>
    <div class="awrap" id="arena"><canvas id="fightCv" width="320" height="180"></canvas><div id="fx"></div><canvas id="banner" width="10" height="10"></canvas><canvas id="bigfx" width="10" height="10"></canvas></div>
    <div class="fctl">
      <div class="waves" id="waveTrack"></div>
      <div class="runinfo" id="runInfo"></div>
      <div class="flog" id="flog"></div>
      <div class="adr" id="adrRow">АДРЕНАЛИН<div class="bar"><i class="fill" id="pAdr"></i></div><b class="cmb" id="comboMul"></b></div>
      <div class="rrow"><button class="btn rage" id="rageBtn" data-act="rage">🔥 ЯРОСТЬ</button><button class="cbtn" data-act="cons" data-v="med"></button><button class="cbtn" data-act="cons" data-v="band"></button><button class="cbtn" data-act="cons" data-v="nrg"></button></div>
      <div id="cmbHint"></div>
      <div class="chips" id="fChips"></div>
      <div class="hint" id="fHint">Боец дерётся сам. Раз в 12 с над кнопками — связка из 3 приёмов: нажми по порядку — мощный комбо-удар.</div>
      <div class="frow f3"><button class="btn sm" id="speedBtn" data-act="speed">⏩ x1</button><button class="btn sm" id="autoBtn" data-act="auto">Авто: выкл</button><button class="btn sm" data-act="surrender">Отступить</button></div>
    </div>
  </div>

  <!-- TRAINING -->
  <div id="train" class="modal"><div class="mbox">
    <div class="title" id="trTitle" style="color:var(--yel)">ТРЕНИРОВКА</div>
    <canvas id="trCv" width="240" height="135"></canvas>
    <div class="trinfo"><span id="trTaps">Подходы: 0</span><span id="trTime">3.0 c</span></div>
    <div class="bar" style="height:12px"><i id="trBar" style="background:var(--cyan);width:100%"></i></div>
    <div class="gap"></div>
    <div class="dim" id="trMsg" style="text-align:center;min-height:36px"></div>
    <div class="gap"></div>
    <button class="btn" id="trClose" data-act="trclose">Закрыть</button>
  </div></div>

  <div id="modal" class="modal"><div class="mbox" id="mbox"></div></div>

  <!-- РЕКЛАМА: окно для рекламы за награду («Второе дыхание», «×2 награда») -->
  <div id="ad" class="modal"><div class="mbox">
    <div class="title" style="color:var(--org);font-size:18px">📺 РЕКЛАМА</div>
    <!-- ▼▼▼ СЮДА ВСТАВЛЯЕТСЯ HTML-БАННЕР / ВИДЕО РЕКЛАМОДАТЕЛЯ ▼▼▼ -->
    <div id="adSlot"></div>
    <!-- ▲▲▲ КОНЕЦ МЕСТА ДЛЯ РЕКЛАМЫ ▲▲▲ -->
    <div class="gap"></div>
    <div class="dim" id="adTimer" style="text-align:center"></div>
    <div class="gap"></div>
    <button class="btn grn" id="adClaim" data-act="adclaim" disabled>Получить награду</button>
    <div class="gap"></div>
    <button class="btn" data-act="adcancel">Закрыть без награды</button>
  </div></div>
  <div id="toast"></div>
  <div id="tip"></div>
  <div id="rotate"><div>📱 ↻<br>Поверните телефон вертикально</div></div>
  <div id="diag"></div>
</div>

 25%, эпические 4,5%, легендарные 0,5% — легендарные только с последних боссов лиги и в следующих кругах. Автофарм вещь не гарантирует. Чем дальше этап, тем сильнее вещь.</li><li>Улучшай за деньги (до +9), лишнее продавай. Всё — на вкладке «Боец».</li></ul><h4>🔥 Ярость</h4><ul><li>Кнопка в бою: 5 секунд урон +35% и атаки чаще. Перезарядка 30 секунд. В «Авто» срабатывает сама.</li></ul><h4>🏛 Зал славы</h4><ul><li>Кнопка на вкладке «Боец»: 5 картинок районов. Картинка района открывается, когда побеждены все 10 его боссов, — на ней арена района и его главный босс. Рамка — в каком круге лиги район пройден: бронза — 1-й, серебро — 2-й, золото — 3-й и дальше.</li><li>Значки — за районы, Короля, круги лиги, победы, легендарку, мастерство, серию входов, спонсоров, комбо.</li></ul><h4>🧰 Расходники</h4><ul><li>Покупаются в «Зале» → «Аптечка и запас», применяются в бою кнопками рядом с «Яростью» (одна вещь раз в 6 с): <b>аптечка</b> — +35% здоровья сразу, <b>бинт с мазью</b> — +25% за 10 с, <b>энергетик</b> — полная стамина и +30 адреналина.</li><li><b>Нашатырь</b> — упал в нокаут: можно встать с 40% здоровья (раз за забег). Дорогой, купить — не больше 3 в сутки.</li><li>Цена растёт с этапом. Шанс победы считается без расходников.</li></ul><h4>🥋 Стили боя</h4><ul><li>Пары приёмов в комбо дают постоянный бонус: Боксёр (джеб + хук), Нокаутёр (апперкот + тяжёлый), Уличный (хук + тяжёлый), Технарь (джеб + уклон), Стена (блок + апперкот), Контрпанчер (блок + уклон). Список — на вкладке «Приёмы».</li></ul><h4>🏆 Сезоны</h4><ul><li>Победил Короля — можно начать новый сезон: этапы заново, соперники сильнее на 15% и бьют больнее, у каждого босса особенность (бешеный, быстрый, живучий…; с 4-го сезона — две), вещи сильнее, а твой урон навсегда +5% за каждый сезон. Награды за этапы те же. Сезонов сколько угодно.</li></ul><h4>⭐ Усиления</h4><ul><li>После 3-й, 6-й и 9-й волны выбери одно усиление из трёх: урон, вампиризм, крит, броня, здоровье, деньги и другие.</li><li>Они действуют до конца забега, одинаковые складываются.</li></ul><h4>💪 Сила и шанс</h4><ul><li>«Сила» — одно число по характеристикам. Сравни её с силой босса на вкладке «Этапы».</li><li>Шанс пройти этап считается по 80 пробным забегам с твоими характеристиками, комбинацией, снаряжением и стилями, а в ручном бою — ещё и с твоей точностью в комбо-связках.</li></ul><h4>▶ Авто</h4><ul><li>Кнопка «Авто» в бою: после победы сам начнётся следующий этап, после поражения — повтор предыдущего (фарм). Усиления выберутся сами через 5 секунд.</li><li>Если на новый этап не хватает энергии, авто фармит последний пройденный — бесплатно. Остановить — кнопкой «Стоп».</li></ul>'+(ADS_ON?"<h4>📺 Реклама за награду</h4><ul><li><b>Второе дыхание</b>: упал — один раз за забег можно встать с 50% здоровья и полным адреналином и продолжить с той же волны.</li><li><b>×2 награда</b> — в итогах забега и за время отсутствия.</li></ul>":"")+'<h4>⚡ Автофарм</h4><ul><li>У пройденных боссов на вкладке «Этапы» — кнопка «Автофарм»: без боя сразу вся награда за этап — 10 волн и босс (деньги, опыт, вещи). Стоит 10⚡.</li></ul><h4>🥋 Школы боя</h4><ul><li><b>Громила</b> — уличный бокс: тяжёлые удары, «Размашистый» пробивает любой блок.</li><li><b>Техник</b> — классический бокс: «Двойка», «Контрудар», уклонения, частые точные удары.</li><li><b>Кикбоксёр</b> — кикбоксинг: лоу-кик (отнимает стамину), мидл-кик, колено, хай-кик.</li><li>У каждой школы свои приёмы на вкладке «Приёмы» и свои стили.</li><li><b>Дерево навыков</b> (вкладка «Приёмы» → «🌳 Дерево навыков»): каждый уровень даёт 3 общих очка развития — каждое можно вложить либо в характеристику (вкладка «Боец»), либо в навык дерева. У каждого бойца 3 школы: Громила — уличный бокс, вольная борьба, грязный бой; Техник — классический бокс, защитный бокс, давление; Кикбоксёр — кикбоксинг, муай-тай, тхэквондо. Сначала открыта только основная, следующая — когда в предыдущую вложено 5 очков. У каждой школы бафф и дебафф (действует, когда школа активна) и своя фирменная связка комбо;
