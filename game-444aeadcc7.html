/* Значки (сборка 108): Microsoft Fluent Emoji, плоский стиль — © Microsoft Corporation, лицензия MIT (github.com/microsoft/fluentui-emoji); ☰ — свой.
   Спрайт 93 клетки 48×48, растеризован из SVG.
   Эмодзи в тексте игры заменяются картинками из спрайта (emojify) — системные эмодзи телефона не используются. */
.em{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.28em;background:var(--emo) no-repeat;background-size:9300% 100%;font-style:normal}
:root{--bg:#0d0a1a;--panel:#1a1430;--panel2:#261d45;--line:#3d2f6b;--txt:#f1e9ff;--dim:#ada0d2;--red:#ff3b4f;--yel:#ffd23f;--grn:#3ee07a;--cyan:#38e8ff;--mag:#ff4fd8;--org:#ff8a2b;
  /* безопасные зоны: вырез/Dynamic Island/полоска «Домой» и панели Telegram в полноэкранном режиме */
  --sat:max(env(safe-area-inset-top),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
  --sab:max(env(safe-area-inset-bottom),calc(var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px)))}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05040a;color:var(--txt);font-family:'SC Text','SC Sym',"Lucida Console","Courier New",monospace;font-synthesis:none;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
#app{position:relative;width:100%;max-width:520px;height:100%;height:100dvh;height:var(--app-h,100dvh);margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 3px #000,0 0 40px #2a1450}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 16px;overscroll-behavior:contain}
.btn{display:block;width:100%;background:var(--panel2);border:3px solid #000;padding:11px 10px;min-height:46px;font-size:14px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),inset 3px 3px 0 rgba(255,255,255,.14);position:relative}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 3px 3px 0 rgba(0,0,0,.4)}
.btn:disabled{opacity:.45;cursor:default}
.btn.red{background:#b3122a}.btn.grn{background:#1e8a47}.btn.yel{background:#c9940a;color:#140c00}.btn.cyan{background:#137c92}.btn.mag{background:#8f1d7c}
.btn.sm{display:inline-block;width:auto;min-height:36px;padding:6px 10px;font-size:12px}
.row{display:flex;gap:8px;align-items:center}
.gap{height:10px}
.card{background:var(--panel);border:3px solid #000;box-shadow:inset 0 0 0 2px var(--line);padding:10px;margin-bottom:10px}
.h{font-weight:bold;font-size:15px;text-transform:uppercase;color:var(--yel);letter-spacing:1px}
.h2{font-weight:bold;font-size:13px;text-transform:uppercase;color:var(--cyan);margin:4px 0 8px;letter-spacing:1px}
.dim{color:var(--dim);font-size:12px;line-height:1.45}
.bar{height:10px;background:#000;border:2px solid #000;position:relative;overflow:hidden;box-shadow:0 0 0 2px var(--line)}
.bar>i{position:absolute;left:0;top:0;bottom:0;display:block;transition:width .15s steps(4)}
.note{background:#3a2a00;border:3px solid #000;box-shadow:inset 0 0 0 2px var(--yel);color:var(--yel);padding:8px 10px;font-size:12px;margin-bottom:10px;font-weight:bold;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{box-shadow:inset 0 0 0 2px #7a5a00}}
/* top bar */
.top{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 8px;align-items:center;padding:8px 10px;background:#120d24;border-bottom:3px solid #000;font-size:12px;padding-top:max(8px,var(--sat))}
.chip{background:#000;padding:3px 6px;border:2px solid var(--line);white-space:nowrap;font-weight:bold}
button.chip{font:inherit;font-weight:bold;cursor:pointer;position:relative;min-height:36px} /* под палец: меню и «📋 ДЕНЬ N» */
.gear .btn.sm{min-height:42px} /* «⬆», «✦», «Надеть», продажа — под палец */
.hofds{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.hofd{display:grid;grid-template-columns:42% 1fr;gap:8px;align-items:center;min-width:0}
.hofd canvas{width:100%;height:auto;display:block;image-rendering:pixelated}
.hofd div{min-width:0;font-size:11px;line-height:1.3}
.hofd b{display:block;font-size:12px}
.hofd i{display:block;font-style:normal;font-weight:bold}
.hofd small{display:block;color:var(--dim)}
.hof{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.hof div{text-align:center;font-size:9px;color:var(--dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hof canvas{width:100%;height:auto;display:block;image-rendering:pixelated}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.badge{background:var(--panel2);border:2px solid #000;box-shadow:inset 0 0 0 2px var(--yel);padding:4px 2px;text-align:center;font-size:10px;font-weight:bold}
.badge b{display:block;font-size:20px;line-height:1.2}.badge small{display:block;font-weight:normal;color:var(--dim);font-size:9px}
.badge.off{opacity:.35;filter:grayscale(1);box-shadow:none}
.badge .bt{font-size:9px;text-transform:uppercase;margin-top:2px}.badge .br{color:var(--yel)!important;margin-top:2px}
.badge.rdy{box-shadow:inset 0 0 0 2px var(--grn)}.badge .btn{margin-top:4px;min-height:32px;padding:4px;font-size:10px}
.card.tree.act{box-shadow:inset 0 0 0 2px var(--yel)}
.card.tree.lock{opacity:.6}
.card.tree .gear .btn.sm{min-width:48px} /* «+» навыка — под палец */
.chip .dot{position:absolute;top:-5px;right:-5px;width:10px;height:10px;background:var(--red);border:2px solid #000;display:none}
.chip.has .dot{display:block}
.streak{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0}
.sday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;background:var(--panel2);border:2px solid #000;font-size:11px}
.sday span{font-size:15px}.sday.got{background:#1f4a2a;box-shadow:inset 0 0 0 2px #3ee07a}.sday.now{box-shadow:inset 0 0 0 2px var(--yel);animation:blink 1s steps(2) infinite}
.lv{color:var(--yel)}.money{color:var(--grn)}.day{color:var(--cyan)}
.xpw{min-width:0}.xpw .bar{height:8px}
.enw{grid-column:1/-1;display:flex;align-items:center;gap:8px}.enw .bar{flex:1}
.enw .ent{font-size:10px;color:var(--dim);white-space:nowrap}
.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:3px solid #000;background:#120d24;padding-bottom:var(--sab)}
.nav button{background:none;border:none;border-right:2px solid #000;padding:9px 2px 8px;font-size:11px;font-weight:bold;text-transform:uppercase;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px}
.nav button:last-child{border-right:none}
.nav button.on{color:var(--yel);background:#1f1640;box-shadow:inset 0 3px 0 var(--yel)}
.nav .ic{font-size:18px;line-height:1}
.nav button{position:relative}
.nav .dot{position:absolute;top:5px;left:calc(50% + 8px);width:10px;height:10px;background:var(--red);border:2px solid #000;display:none}
.nav button.has .dot{display:block}
#fightbar{padding:6px 10px;background:#120d24;border-top:3px solid #000}
#fightbar:empty{display:none}
.fbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--red);color:#fff;border:3px solid #000;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),3px 3px 0 #000;padding:8px 10px;font:inherit;font-weight:bold;font-size:16px;text-transform:uppercase;text-align:left;cursor:pointer}
.fbtn .fst{display:block;font-size:11px;font-weight:normal;text-transform:none;opacity:.92;margin-top:2px}
.fbtn .pct{flex:none;font-size:20px;background:#000;padding:3px 8px;border:2px solid currentColor}
.ibtn{display:inline-grid;place-items:center;width:20px;height:20px;margin-left:6px;vertical-align:middle;background:#000;color:var(--cyan);border:2px solid var(--cyan);font-weight:bold;font-size:12px;line-height:1;padding:0;cursor:pointer;text-transform:none;letter-spacing:0}
.chance{font-size:16px}
.fbrow{display:flex;gap:6px}.fbrow .fbtn{flex:1;min-width:0}.fbrow .fbtn.farm{flex:0 0 36%;background:#1e8a47}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px}
.seg button{background:var(--panel2);color:var(--dim);border:2px solid #000;padding:8px 2px;font:inherit;font-size:11px;font-weight:bold;cursor:pointer}
.seg button.on{background:#1f1640;color:var(--yel);box-shadow:inset 0 -3px 0 var(--yel)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.srow{margin:8px 0 10px;font-size:12px;line-height:1.8}
.srow .btn{display:inline-block;width:auto;margin-left:4px}
#diag.min{left:auto;right:6px;bottom:auto;top:calc(96px + var(--sat));max-height:none;padding:4px 8px;font-size:13px;font-weight:bold;overflow:hidden;white-space:nowrap}
#saveInfo{margin-top:6px;color:var(--dim)}
/* hub */
.hero{display:flex;gap:10px;align-items:center}
.hero canvas{width:96px;height:96px;background:#0a0716;border:3px solid #000;box-shadow:inset 0 0 0 2px var(--line);flex:none}
.stat{display:grid;grid-template-columns:1fr auto 40px;gap:4px 8px;align-items:center;padding:7px 0;border-bottom:2px dashed #2b2150}
.stat:last-child{border-bottom:none}
.stat .v{font-size:18px;font-weight:bold;color:var(--yel);min-width:28px;text-align:right}
.stat .bar{grid-column:1/3;height:6px}
.plus{width:40px;height:36px;grid-row:1/3;grid-column:3;background:#1e8a47;border:3px solid #000;font-size:20px;font-weight:bold;box-shadow:inset -2px -2px 0 rgba(0,0,0,.4)}
.plus:disabled{background:#2a2440;opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kv{background:#0e0a1e;border:2px solid #000;padding:6px 8px;font-size:12px}
.kv b{display:block;font-size:15px;color:var(--txt)}
.kv span{color:var(--dim)}
.tcard{display:flex;gap:10px;align-items:center;background:var(--panel);border:3px solid #000;box-shadow:inset 0 0 0 2px var(--line);padding:10px;margin-bottom:8px;width:100%;text-align:left}
.tcard.deal{box-shadow:inset 0 0 0 2px var(--grn)}
.tcard .dtag{font-size:10px;color:#000;background:var(--grn);padding:1px 4px;text-transform:none;white-space:nowrap}
.tcard .ico{font-size:26px;width:42px;height:42px;display:grid;place-items:center;background:#0b0818;border:2px solid #000;flex:none}
.tcard .tx{flex:1;min-width:0}
.tcard .nm{font-weight:bold;text-transform:uppercase;font-size:13px}
.tcard .bar{height:6px;margin-top:5px}
.tcard .cost{font-size:12px;color:var(--cyan);font-weight:bold;white-space:nowrap}
.tcard:active{transform:translateY(2px)}
.tcard:disabled{opacity:.45;filter:grayscale(.6)}
.tcard:disabled:active{transform:none}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.slot{background:#0b0818;border:3px solid #000;box-shadow:inset 0 0 0 2px var(--mag);min-height:48px;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:bold;padding:4px;text-transform:uppercase}
.slot.empty{box-shadow:inset 0 0 0 2px #2b2150;color:#4b3f7a}
.mv{background:var(--panel);border:3px solid #000;box-shadow:inset 0 0 0 2px var(--line);padding:10px;margin-bottom:8px}
.mv.sel{box-shadow:inset 0 0 0 2px var(--mag)}
.mv .t{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mv .nm{font-weight:bold;text-transform:uppercase}
.tag{font-size:10px;padding:2px 5px;border:2px solid #000;font-weight:bold;text-transform:uppercase}
.tag.atk{background:#7a1020}.tag.def{background:#10507a}.tag.duo{background:#8f1d7c;color:#fff;vertical-align:middle}
.mvst{display:flex;gap:10px;font-size:11px;color:var(--dim);margin:6px 0;flex-wrap:wrap}
.mvst b{color:var(--txt)}
.opp{display:flex;gap:10px;align-items:center;background:var(--panel);border:3px solid #000;box-shadow:inset 0 0 0 2px var(--line);padding:8px;margin-bottom:8px}
.opp canvas{width:80px;height:80px;background:#0a0716;border:2px solid #000;flex:none}
.opp .tx{flex:1;min-width:0}
.opp .nm{font-weight:bold;text-transform:uppercase;font-size:13px}
.opp.lock{opacity:.6}.opp.lock canvas{filter:brightness(.3)}
.opp.next{box-shadow:inset 0 0 0 2px var(--red);animation:pulse 1.2s steps(2) infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 2px #6a0e1c}}
.opp.done .nm::after{content:" ✓";color:var(--grn)}
.opp .btn{width:auto;min-height:40px;padding:6px 10px;font-size:12px}
.opp .obtns{display:flex;flex-direction:column;gap:6px}.opp .obtns .btn{width:100%}
.ostat{font-size:11px;color:var(--dim);margin-top:3px}
/* title */
#scr-title{justify-content:flex-start;background:#07050f;padding-top:var(--sat);padding-bottom:var(--sab)}
#titleCv{width:100%;flex:1 1 0;min-height:calc(min(100vw,520px)*.5625);max-height:calc(min(100vw,520px)*1.25);box-shadow:0 3px 0 #000} /* сцена занимает свободное место (края обрезаются, не растягивается); тень вместо рамки */
#scr-title .menu{margin-bottom:0}
.logo{text-align:center;padding:14px 10px 6px}
.logo .a{font-size:30px;font-weight:bold;color:var(--yel);letter-spacing:2px;line-height:1.05;text-shadow:3px 0 #000,-3px 0 #000,0 3px #000,0 -3px #000,4px 4px 0 var(--red),6px 6px 0 #000}
.logo .b{font-size:18px;font-weight:bold;color:var(--cyan);letter-spacing:6px;margin-top:8px;text-shadow:2px 2px 0 #000}
.menu{padding:10px 18px;display:flex;flex-direction:column;gap:9px;max-width:360px;width:100%;margin:0 auto}
.foot{text-align:center;font-size:10px;color:#4b3f7a;padding:8px}
/* fight */
#scr-fight{background:#000}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;padding:6px 8px;background:#0b0818;border-bottom:3px solid #000;padding-top:max(6px,var(--sat))}
.side .nm{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.side.r .nm{margin-left:auto}
.side.r{text-align:right}
.side{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;min-width:0}.sb{flex:1;min-width:0}
.nmrow{width:100%;display:flex;min-height:14px}.side.r .nmrow{justify-content:flex-end}
.face{width:50px;height:50px;flex:none;border:2px solid #000;box-shadow:0 0 0 2px var(--line);background:#1a1430}
/* полоски в духе Punch Club: широкое зелёное здоровье с цифрами, под ним оранжевая стамина */
.side .bar{height:12px;margin-bottom:5px;background:#1a1410;box-shadow:0 0 0 2px #4a3a1a}
.side .bar.hp{height:16px;box-shadow:0 0 0 2px #2a4a10,0 0 0 4px #000}
.side .bar.st{height:13px;box-shadow:0 0 0 2px #4a2a08,0 0 0 4px #000;margin-top:4px}
.side.r .bar>i{left:auto;right:0}
.hp .fill{background:linear-gradient(#d4ff6a 0 2px,#9ae234 2px 45%,#6cb81e 45% calc(100% - 2px),#3a7a10 calc(100% - 2px))}
.hp .ghost{background:#fff6c0;opacity:.8}
.st .fill{background:linear-gradient(#ffd27a 0 2px,#f0a030 2px 50%,#c87818 50%)}
.hp.low .fill{background:linear-gradient(#ffb0a0 0 2px,#ff5a4a 2px 45%,#d4202f 45%)}
.bar .num{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;color:#fff;text-shadow:1px 0 #000,-1px 0 #000,0 1px #000,0 -1px #000;letter-spacing:.5px;white-space:nowrap}
.bar.st .num{font-size:9px}
/* таймер — круглый медальон, под ним номер волны (как «раунд 1 из 10») */
.ftimer{display:flex;flex-direction:column-reverse;align-items:center;gap:9px;min-width:58px;padding-top:6px}
.ftimer small{font-size:9px;font-weight:bold;color:#f0d890;letter-spacing:1px;text-shadow:1px 1px 0 #000;white-space:nowrap}
.ftimer span{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;color:#fff3c0;
  background:radial-gradient(circle at 50% 40%,#3a2a10 0 55%,#1a1206 56%);box-shadow:0 0 0 3px #c9940a,0 0 0 5px #5a3a08,0 0 0 7px #000;text-shadow:2px 2px 0 #000}
.awrap{position:relative;width:100%;aspect-ratio:6/5;max-height:40%;background:#000;overflow:hidden;cursor:pointer;touch-action:none}
.awrap canvas{width:100%;height:100%}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ft{position:absolute;transform:translate(-50%,-50%);font-weight:bold;font-size:16px;white-space:nowrap;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000;animation:rise .9s steps(9) forwards}
.ft.big{font-size:22px}
@keyframes rise{0%{margin-top:6px;opacity:1}15%{margin-top:-8px}100%{margin-top:-34px;opacity:0}}
#banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-60%);height:22%;width:auto;max-width:96%;pointer-events:none;display:none}
#banner.on{display:block;animation:popc .35s steps(4)}
#bigfx{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);height:15%;width:auto;max-width:96%;pointer-events:none;display:none}
#bigfx.on{display:block;animation:bfx .7s steps(7) forwards}
@keyframes bfx{0%{transform:translate(-50%,-50%) scale(2);opacity:0}20%{transform:translate(-50%,-50%) scale(1);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
@keyframes popc{0%{transform:translate(-50%,-60%) scale(2.2);opacity:0}100%{transform:translate(-50%,-60%) scale(1);opacity:1}}
@keyframes pop{0%{transform:scale(2.2);opacity:0}100%{transform:scale(1);opacity:1}}
.fctl{flex:1;display:flex;flex-direction:column;gap:8px;padding:8px 10px;background:var(--bg);min-height:0;overflow-y:auto;padding-bottom:max(8px,var(--sab))}
/* кнопки приёмов — крупные, по одной на приём, с зазором: по ним жмут в окнах комбо */
.chips{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:10px}
.fctl .chips{flex:1 1 auto;min-height:72px;max-height:150px}
.mchip{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:72px;background:var(--panel2);border:3px solid #000;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.45),inset 3px 3px 0 rgba(255,255,255,.12);text-align:center;padding:6px 2px;font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;color:var(--txt);
  touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden}
.mchip .ic{font-size:26px;line-height:1}
.mchip.on{box-shadow:inset 0 0 0 3px var(--yel),inset -3px -3px 0 rgba(0,0,0,.45);color:var(--yel)}
/* комбо-связка: приём, который надо нажать сейчас, пульсирует, полоска снизу — время на нажатие */
.mchip.cw{background:#00b8d8;color:#04121a;box-shadow:inset 0 0 0 3px #fff;animation:cwp .3s steps(2) infinite}
.mchip.cw::after{content:'';position:absolute;left:0;bottom:0;height:7px;width:var(--cw,100%);background:#fff;box-shadow:0 -2px 0 #04121a}
.mchip.bad{background:#b3122a;color:#fff;box-shadow:inset 0 0 0 3px #ff5a6a}
.mchip:active{transform:translateY(2px)}
@keyframes cwp{50%{box-shadow:inset 0 0 0 3px #38e8ff;background:#38e8ff}}
.adr .cmb{min-width:44px;text-align:right;color:#38e8ff}
#cmbHint{display:flex;align-items:center;justify-content:center;gap:5px;height:32px;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden}
#cmbHint .st{display:inline-grid;place-items:center;width:32px;height:28px;border:2px solid #000;background:var(--panel2);font-size:16px;line-height:1}
#cmbHint .st.ok{background:#1f7a3a;box-shadow:inset 0 0 0 2px #3ee07a}
#cmbHint .st.now{background:#00b8d8;box-shadow:inset 0 0 0 2px #fff;animation:cwp .3s steps(2) infinite}
#cmbHint .ar{color:var(--dim);font-size:11px}
#cmbHint b{color:#38e8ff}
.adr{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:bold;color:var(--org)}
.adr .bar{flex:1;height:12px}
.adr .fill{background:linear-gradient(90deg,#ff8a2b,#ffd23f)}
.adr.full .fill{background:#fff;animation:fl .3s steps(2) infinite}
@keyframes fl{50%{background:var(--yel)}}
@media (max-height:700px){.fctl .hint{display:none}.fctl{gap:6px}}
@keyframes fl2{50%{background:#ffd23f}}
/* автобатлер: дорожка волн этапа (10 волн + босс) */
.waves{display:grid;grid-template-columns:repeat(10,1fr) 2fr;gap:3px}
.waves i{height:20px;background:#1a1430;border:2px solid #000;box-shadow:inset 0 0 0 1px #2b2150;font-style:normal;font-size:10px;font-weight:bold;line-height:16px;text-align:center;color:var(--dim)}
.waves i.done{background:#1f6a2a;color:#fff}
.waves i.cur{background:var(--yel);color:#140c00;animation:fl2 .6s steps(2) infinite}
.waves i.boss{background:#4a0c18;color:#ffd23f}
.waves i.boss.cur{background:var(--red);color:#fff;animation:none}
.waves i.lost{background:#5a0e1a;color:#fff}
.waves i.skip{background:#14101e;color:#4a4060;box-shadow:inset 0 0 0 1px #241c36}
.gear{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:2px dashed #2b2150}
.gear .gic{font-size:20px;width:26px;text-align:center}
.gear .gtx{flex:1;min-width:0;display:flex;flex-direction:column;font-size:12px}
.gear .gtx small{color:var(--dim);font-size:11px}
.gear .btn{min-height:32px;padding:4px 8px;width:auto}
.ggrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 6px}
.ggrid.eq{grid-template-columns:repeat(4,1fr)}
.gt{position:relative;aspect-ratio:1;min-height:44px;padding:0;background:var(--panel2);border:3px solid #3a2f66;box-shadow:inset 0 0 0 2px #000,0 2px 0 #000;font-size:24px;line-height:1;display:grid;place-items:center;cursor:pointer;font-family:inherit}
.gt.empty{opacity:.4;filter:grayscale(1)}
.gt.sel{outline:3px solid #fff;outline-offset:1px}
.gt .lv{position:absolute;left:3px;bottom:2px;font-size:11px;font-style:normal;font-weight:bold;color:#fff;text-shadow:1px 0 #000,-1px 0 #000,0 1px #000,0 -1px #000}
.gt .up{position:absolute;right:3px;top:2px;font-size:13px;color:var(--grn);text-shadow:1px 1px 0 #000}
.gt .wr{position:absolute;right:2px;bottom:1px;font-size:11px}
@keyframes hlp{0%,100%{box-shadow:0 0 0 0 #fff0}50%{box-shadow:0 0 0 4px #fff,0 0 14px 6px #ffd23f}}
.btn.hl,.fbtn.hl{animation:hlp .6s steps(3) 4;position:relative;z-index:2}
.grow2{display:flex;gap:6px;margin-bottom:6px}.grow2 .btn{flex:1}
.loot{font-size:12px;text-align:left;margin:6px 0;line-height:1.5}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;background:#1a1430;border:3px solid #000;box-shadow:inset 0 0 0 2px #3d2f6b;color:var(--txt);padding:6px 2px;font:inherit;cursor:pointer;min-width:0}
.pick img{image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%;object-fit:contain}
.pick b{font-size:12px;white-space:nowrap}
.pick small{font-size:10px;color:var(--dim)}
.pick.on{box-shadow:inset 0 0 0 3px var(--yel);background:#2a1f00}
.btn.rage{background:#3a1a0a;color:#ff8a2b;min-height:44px;box-shadow:inset 0 0 0 2px #5a2a10}
.rrow{display:flex;gap:6px;align-items:stretch}
.rrow .rage{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbtn{position:relative;flex:none;width:48px;min-height:44px;background:var(--panel2);border:3px solid #000;box-shadow:inset 0 0 0 2px #3ee07a;font-size:20px;line-height:1;padding:0;color:#fff}
.cbtn b{position:absolute;right:3px;bottom:2px;font-size:10px;color:#3ee07a}
.cbtn:disabled{opacity:.5;box-shadow:inset 0 0 0 2px var(--line)}
.cbtn.none{opacity:.3}
.cbtn:active{transform:translateY(2px)}
.btn.rage.ready{background:#b3122a;color:#fff;box-shadow:inset 0 0 0 2px var(--org);animation:fl2 .8s steps(2) infinite}
.btn.rage.active{background:#ff8a2b;color:#140c00}
.btn.rage:disabled{opacity:1}
.style{padding:6px 0;border-bottom:2px dashed #2b2150;font-size:13px;color:var(--dim)}
.style b{color:var(--txt)}.style.on b{color:var(--grn)}
.style small{font-size:11px}
.runinfo{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:bold;color:var(--txt)}
.runinfo .money{color:var(--grn)}.runinfo .xp{color:var(--yel)}
.flog{font-size:11px;color:var(--dim);line-height:1.5;height:46px;overflow:hidden;flex:none;background:#07050f;border:2px solid #000;padding:5px 8px}
.fctl .flog{height:40px;line-height:1.35;padding:4px 8px;margin-top:auto} /* лог — две последние строки, место отдано кнопкам приёмов */
.flog div:first-child{color:var(--txt)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:10px;color:#6c5ea0;text-align:center}
/* выбор усиления «1 из 3» */
.perks{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.perk{display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;background:#1a1430;border:3px solid #000;box-shadow:inset 0 0 0 2px var(--yel);color:var(--txt);padding:9px 10px;font:inherit;cursor:pointer}
.perk .ic{grid-row:1/3;font-size:26px;text-align:center}
.perk b{font-size:14px;color:var(--yel)}
.perk .dim{font-size:12px}
.perk:active{filter:brightness(1.3)}
.perkrow{font-size:12px;color:var(--yel);text-align:center;margin:4px 0}
.frow.f3{grid-template-columns:1fr 1fr 1fr}
.power{color:var(--txt)}.power b{color:var(--org)}
div.power:not(.ostat){font-size:13px;margin-top:4px}
#autoBtn.on{box-shadow:inset 0 0 0 2px var(--grn);color:var(--grn)}
/* modal */
.modal{position:absolute;inset:0;background:rgba(5,3,12,.86);display:none;align-items:center;justify-content:center;padding:max(14px,var(--sat)) 14px max(14px,var(--sab));z-index:20}
.modal.on{display:flex}
.mbox{background:var(--panel);border:3px solid #000;box-shadow:inset 0 0 0 3px var(--line),8px 8px 0 #000;padding:16px;width:100%;max-width:400px;max-height:100%;overflow-y:auto;animation:pop .25s steps(3)}
.btn,.fbtn,.mbox .title,.h2,.logo,.tcard .nm,.nav button{font-family:'SC Arcade','SC Sym','SC Text',monospace}
.btn,.fbtn,.h2,.tcard .nm,.nav button{letter-spacing:.5px}
.btn.rage,.frow .btn{font-size:12px;white-space:nowrap}
.top .chip{white-space:nowrap}
.mbox .title{font-size:24px;line-height:1.3;font-weight:bold;text-align:center;margin-bottom:10px;letter-spacing:2px;text-shadow:3px 3px 0 #000}
.mbox p{font-size:13px;line-height:1.5;margin-bottom:8px}
.rew{display:flex;justify-content:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.rew div{background:#000;border:2px solid var(--line);padding:6px 10px;font-weight:bold}
#trCv{width:100%;aspect-ratio:16/9;box-shadow:0 0 0 3px #000;margin:3px 0;cursor:pointer;touch-action:none} /* тень вместо рамки — не искажает пропорции */
.trinfo{display:flex;justify-content:space-between;font-weight:bold;margin:8px 0 6px;font-size:14px}
.help h4{color:var(--cyan);margin:10px 0 4px;text-transform:uppercase;font-size:13px}
.help p,.help li{font-size:12px;line-height:1.5;color:#d8ccf5}
.help ul{padding-left:18px}
#ad{z-index:30}
#adSlot{min-height:200px;background:#000;border:3px solid #000;box-shadow:inset 0 0 0 2px var(--org);display:grid;place-items:center;overflow:hidden}
.adstub{text-align:center;color:var(--dim);font-size:13px;line-height:1.6;padding:16px}
.adstub b{display:block;font-size:20px;color:var(--org);margin-bottom:6px}
#rotate{display:none;position:fixed;inset:0;z-index:100;background:#05040a;color:var(--yel);font-weight:bold;font-size:18px;line-height:1.6;text-align:center;align-items:center;justify-content:center;padding:20px}
@media (orientation:landscape) and (max-height:500px){#rotate{display:flex}} /* телефон боком — игра рассчитана на вертикальный экран */
#diag{display:none;position:fixed;left:6px;right:6px;bottom:calc(6px + var(--sab));z-index:200;background:rgba(80,0,12,.94);color:#fff;font:11px/1.4 monospace;padding:8px;border:2px solid var(--red);max-height:50%;overflow:auto;white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text}
#diag.on{display:block}
#build{color:#6c5ea0;cursor:pointer}
#toast{position:absolute;left:50%;top:calc(70px + var(--sat));transform:translateX(-50%);background:#000;border:3px solid var(--yel);color:var(--yel);padding:8px 12px;font-size:13px;font-weight:bold;z-index:40;display:none;max-width:90%;text-align:center;box-shadow:4px 4px 0 #000}
#toast.on{display:block;animation:pop .2s steps(3)}
#tip{position:absolute;left:10px;right:10px;bottom:calc(150px + var(--sab));z-index:30;background:#0b0818;border:3px solid #000;box-shadow:inset 0 0 0 2px var(--cyan),4px 4px 0 #000;padding:10px 12px;display:none;font-size:13px;line-height:1.45}
#tip.on{display:block;animation:pop .2s steps(3)}
#tip.top{bottom:auto;top:calc(64px + var(--sat))}
#tip b{display:block;color:var(--cyan);margin-bottom:4px}
#tip ul{margin:0 0 8px;padding-left:18px}
#tip .btn{padding:8px}
.namein{display:block;width:100%;background:#000;color:var(--yel);border:3px solid #000;box-shadow:inset 0 0 0 2px var(--yel);padding:12px;font:bold 20px "Lucida Console","Courier New",monospace;text-align:center;text-transform:uppercase;letter-spacing:2px;user-select:text;-webkit-user-select:text;outline:none}
.namein:focus{box-shadow:inset 0 0 0 2px #fff}
.heroname{display:block;image-rendering:pixelated;image-rendering:crisp-edges;margin-bottom:6px}
</style>
</head>
<body>
<div id="app">
  <!-- TITLE -->
  <div id="scr-title" class="screen on">
    <canvas id="titleCv" width="320" height="180"></canvas>
    <div class="logo"><div class="a">УЛИЧНЫЙ<br>ЧЕМПИОН</div><div class="b">КАРЬЕРА</div></div>
    <div class="menu">
      <button class="btn red" id="btnContinue" data-act="continue">Продолжить</button>
      <button class="btn grn" data-act="newgame">Новая карьера</button>
      <button class="btn" data-act="help">Как играть</button>
      <button class="btn" data-act="sound" id="btnSound">Звук: вкл</button>
      <button class="btn" data-act="vibro" id="btnVibro" style="display:none">Вибрация: вкл</button>
    </div>
    <div class="foot">5 районов · 50 боссов · 500 волн · 1 пояс<br><span id="build"></span><div id="saveInfo"></div></div>
  </div>

  <!-- HUB -->
  <div id="scr-hub" class="screen">
    <div class="top" id="topbar"></div>
    <div class="scroll" id="tabBody"></div>
    <div id="fightbar"></div>
    <nav class="nav" id="nav">
      <button data-act="tab" data-v="fighter"><span class="ic">🥊</span>Боец<i class="dot"></i></button>
      <button data-act="tab" data-v="gym"><span class="ic">🏋</span>Зал<i class="dot"></i></button>
      <button data-act="tab" data-v="moves"><span class="ic">👊</span>Приёмы<i class="dot"></i></button>
      <button data-act="tab" data-v="league"><span class="ic">🏆</span>Этапы<i class="dot"></i></button>
    </nav>
  </div>

  <!-- FIGHT -->
  <div id="scr-fight" class="screen">
    <div class="hud">
      <div class="side"><div class="nmrow"><canvas class="nm" id="pName" width="10" height="10"></canvas></div><canvas class="face" id="pFace" width="56" height="56"></canvas><div class="sb"><div class="bar hp" id="pHpBar"><i class="ghost" id="pGhost"></i><i class="fill" id="pHp"></i><b class="num" id="pHpN"></b></div><div class="bar st"><i class="fill" id="pSt"></i><b class="num" id="pStN"></b></div></div></div>
      <div class="ftimer"><small id="fRound">ВОЛНА</small><span id="fTimer">30</span></div>
      <div class="side r"><div class="nmrow"><canvas class="nm" id="oName" width="10" height="10"></canvas></div><div class="sb"><div class="bar hp" id="oHpBar"><i class="ghost" id="oGhost"></i><i class="fill" id="oHp"></i><b class="num" id="oHpN"></b></div><div class="bar st"><i class="fill" id="oSt"></i><b class="num" id="oStN"></b></div></div><canvas class="face" id="oFace" width="30" height="30"></canvas></div>
    </div>
    <div class="awrap" id="arena"><canvas id="fightCv" width="320" height="180"></canvas><div id="fx"></div><canvas id="banner" width="10" height="10"></canvas><canvas id="bigfx" width="10" height="10"></canvas></div>
    <div class="fctl">
      <div class="waves" id="waveTrack"></div>
      <div class="runinfo" id="runInfo"></div>
      <div class="flog" id="flog"></div>
      <div class="adr" id="adrRow">АДРЕНАЛИН<div class="bar"><i class="fill" id="pAdr"></i></div><b class="cmb" id="comboMul"></b></div>
      <div class="rrow"><button class="btn rage" id="rageBtn" data-act="rage">🔥 ЯРОСТЬ</button><button class="cbtn" data-act="cons" data-v="med"></button><button class="cbtn" data-act="cons" data-v="band"></button><button class="cbtn" data-act="cons" data-v="nrg"></button></div>
      <div id="cmbHint"></div>
      <div class="chips" id="fChips"></div>
      <div class="hint" id="fHint">Боец дерётся сам. Раз в 12 с над кнопками — связка из 3 приёмов: нажми по порядку — мощный комбо-удар.</div>
      <div class="frow f3"><button class="btn sm" id="speedBtn" data-act="speed">⏩ x1</button><button class="btn sm" id="autoBtn" data-act="auto">Авто: выкл</button><button class="btn sm" data-act="surrender">Отступить</button></div>
    </div>
  </div>

  <!-- TRAINING -->
  <div id="train" class="modal"><div class="mbox">
    <div class="title" id="trTitle" style="color:var(--yel)">ТРЕНИРОВКА</div>
    <canvas id="trCv" width="240" height="135"></canvas>
    <div class="trinfo"><span id="trTaps">Подходы: 0</span><span id="trTime">3.0 c</span></div>
    <div class="bar" style="height:12px"><i id="trBar" style="background:var(--cyan);width:100%"></i></div>
    <div class="gap"></div>
    <div class="dim" id="trMsg" style="text-align:center;min-height:36px"></div>
    <div class="gap"></div>
    <button class="btn" id="trClose" data-act="trclose">Закрыть</button>
  </div></div>

  <div id="modal" class="modal"><div class="mbox" id="mbox"></div></div>

  <!-- РЕКЛАМА: окно для рекламы за награду («Второе дыхание», «×2 награда») -->
  <div id="ad" class="modal"><div class="mbox">
    <div class="title" style="color:var(--org);font-size:18px">📺 РЕКЛАМА</div>
    <!-- ▼▼▼ СЮДА ВСТАВЛЯЕТСЯ HTML-БАННЕР / ВИДЕО РЕКЛАМОДАТЕЛЯ ▼▼▼ -->
    <div id="adSlot"></div>
    <!-- ▲▲▲ КОНЕЦ МЕСТА ДЛЯ РЕКЛАМЫ ▲▲▲ -->
    <div class="gap"></div>
    <div class="dim" id="adTimer" style="text-align:center"></div>
    <div class="gap"></div>
    <button class="btn grn" id="adClaim" data-act="adclaim" disabled>Получить награду</button>
    <div class="gap"></div>
    <button class="btn" data-act="adcancel">Закрыть без награды</button>
  </div></div>
  <div id="toast"></div>
  <div id="tip"></div>
  <div id="rotate"><div>📱 ↻<br>Поверните телефон вертикально</div></div>
  <div id="diag"></div>
</div>

  try{

function tone(f1,f2,dur,type,vol,delay){
  const t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur,vol,freq){
  const t=AC.currentTime, s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=NOISE; f.type='lowpass'; f.frequency.value=freq||1800;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);

}

function trainRep(){

  TR.anim++; TR.poseT=150;
  if(TR.k==='str'){ TR.pose='jab'; TR.bagV+=.06; }
  else if(TR.k==='spd'){ TR.pose='jump'; }
  else if(TR.k==='end'){ TR.pose=TR.anim%2?'run1':'run2'; TR.poseT=260; }

  if(TR.poseT>0){ TR.poseT-=dt; if(TR.poseT<=0) TR.pose=TR.k==='spd'?'stand':TR.k==='end'?'run1':'idle'; }
  TR.ball=Math.max(0,TR.ball-dt/300);

    TR.time-=dt; TR.tick-=dt; if(TR.tick<=0){ TR.tick=TR.k==='end'?260:220; trainRep(); } $('#trTime').textContent=Math.max(0,TR.time/1000).toFixed(1)+' c'; $('#trBar').style.width=Math.max(0,TR.time/TRAIN_TIME*100)+'%';

const AD_CONFIG={

function closeAdOverlay(){ if(AD) clearInterval(AD.timer); $('#ad').classList.remove('on'); $('#adSlot').innerHTML=''; AD=null; }
function showRewardedAd(onReward){
  if(AD) return;
  let done=false;
  // reward() — вызвать, когда реклама досмотрена; cancel() — если закрыта раньше или произошла ошибка
  const reward=()=>{ if(done) return; done=true; closeAdOverlay(); onReward(); };
  const cancel=msg=>{ if(done) return; done=true; closeAdOverlay(); toast(msg||'Реклама не досмотрена — награды нет'); };
  AD={reward,cancel,timer:0,left:Infinity};

  /* ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼ ВСТАВЬТЕ КОД РЕКЛАМОДАТЕЛЯ ЗДЕСЬ ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
     Покажите рекламу и по её итогу вызовите reward() или cancel(), затем return.
     SDK рекламной сети подключается тегом <script> в <head> (игра тогда потребует интернет).

     Пример — Яндекс Игры (rewarded video):
       ysdk.adv.showRewardedVideo({callbacks:{
         onRewarded:()=>reward(),
         onClose:()=>cancel(),
         onError:()=>cancel('Реклама недоступна, попробуй позже')
       }}); return;

     Пример — Google H5 Games Ads:
       adBreak({type:'reward',name:'sleep',
         beforeReward:show=>show(), adViewed:()=>reward(), adDismissed:()=>cancel(),
         adBreakDone:()=>cancel('Реклама недоступна, попробуй позже')}); return;

     Пример — свой баннер/видео в окне: положите HTML в $('#adSlot').innerHTML
     и удалите блок заглушки ниже, оставив таймер и кнопки.
     ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ КОНЕЦ ВСТАВКИ ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ */

  // Заглушка: показывает окно-плейсхолдер с обратным отсчётом (работает офлайн)
  $('#adSlot').innerHTML='<div class="adstub"><b>ЗДЕСЬ БУДЕТ РЕКЛАМА</b>Место для баннера или видео рекламодателя</div>';
  AD.left=AD_CONFIG.stubSeconds;
  const tick=()=>{
    if(!AD) return;
    $('#adTimer').textContent=AD.left>0?'Награда через '+AD.left+' c…':'Можно забрать награду!';
    $('#adClaim').disabled=AD.left>0;
    AD.left--;
    if(AD.left<-1) clearInterval(AD.timer);
  };
  tick(); AD.timer=setInterval(tick,1000);
  $('#ad').classList.add('on');
}

const FBUF=layer(W,H), TBUF=layer(W,H), fctx=FBUF.getContext('2d'), tctx=TBUF.getContext('2d'); // игра рисует в буферы 320×180; на экран — present()

let last=performance.now(), titleAt=0;
function loop(now){
  const dt=clamp(now-last,0,50); last=now; FRAMES++;
  if(FRAMES%60===1) step('имена',checkNames); // раз в секунду: не подменил ли кто-то функции игры
  if(screen==='fight'&&F){
    if(!$('#modal').classList.contains('on')) step('логика боя',()=>updateFight(dt*F.speed)); // пауза, пока открыто окно
    if(F){
      step('сцена боя',()=>{ if(F.state==='intro'&&F.introT>VS_END) drawVS(fctx,F,now);
        else drawScene(fctx,F.arena,[F.p,F.o],now,{shake:F.shake,parts:F.parts,cheer:F.cheer,flashAll:F.flashAll,fx:F.fx}); });
      step('полоски',renderHUD);
      step('вывод боя',()=>present(FBUF,$('#fightCv'),true));
    }
  } else if(screen==='title'){
    titleAt+=dt; const ph=Math.floor(titleAt/700)%6;
    TITLE_F[0].pose=ph===2?'jab':ph===4?'hook':'idle'; TITLE_F[1].pose=ph===2?'block':ph===4?'hit':ph===5?'uppercut':'idle';
    TITLE_F[0].pose=ph===5?'block':TITLE_F[0].pose;
    step('заставка',()=>drawScene(tctx,0,TITLE_F,now,{}));
    step('вывод заставки',()=>present(TBUF,$('#titleCv'),true));
  } else if(screen==='hub'&&tab==='fighter') step('портрет',()=>drawPortrait(now));
  if(TR) step('зал',()=>{ updateTrain(dt); drawTrain(now); present(TRBUF,$('#trCv')); });
  step('telegram',tgSyncBack);
  requestAnimationFrame(loop);
}

/* ---------- QA: безголовая симуляция баланса (консоль: simBattle(статы, этап, комбо, n)) ----------
   winRate — доля забегов, где побеждён босс; bossRate — дошёл до босса; avgWave — средняя волна, где закончился забег; avgSec — длительность забега */
function simBattle(st,oi,load,n,from,cmb){ // cmb — доля пойманных окон комбо (0 — без комбо)
  n=n||200; const keep=F; let wins=0,boss=0,waves=0,time=0;
  for(let k=0;k<n;k++){
    F=newFight(oi,true,st,load,from); F.simCmb=cmb||0;
    let guard=0; while((F.state==='fight'||F.state==='swap'||F.state==='end')&&guard++<40000){ updateFight(50); time+=50; }
    if(F.winner==='p') wins++; if(isBoss()) boss++; waves+=Math.min(F.wave,WAVES+1);
  }
  F=keep; return {winRate:+(wins/n).toFixed(2),bossRate:+(boss/n).toFixed(2),avgWave:+(waves/n).toFixed(1),avgSec:+(time/n/1000).toFixed(1)};
}
window.simBattle=simBattle;

/* ---------- TELEGRAM MINI APP ----------
   Игра запускается из Telegram-бота как Mini App (https://core.telegram.org/bots/webapps).
   Вне Telegram всё это молча отключено — игра работает как обычно, в том числе офлайн. */
const TGA={app:null,cloud:false,back:null,confirm:null,timer:0};
function tgInit(){
  const w=window.Telegram&&window.Telegram.WebApp;
  if(TGA.app||!w||!w.initData) return; // initData пустая — значит, открыто не из Telegram
  TGA.app=w; vibroBtn();
  try{
    w.ready(); w.expand(); fitViewport();
    if(w.onEvent) w.onEvent('viewportChanged',fitViewport);                 // высота окна Telegram меняется — подстраиваемся
    if(w.isVersionAtLeast('8.0')&&w.lockOrientation) w.lockOrientation();  // не поворачивать игру боком
    if(w.isVersionAtLeast('7.7')) w.disableVerticalSwipes();          // свайп вниз не закрывает игру во время тапов
    if(w.isVersionAtLeast('6.1')){ w.setHeaderColor('#120d24'); w.setBackgroundColor('#05040a'); w.BackButton.onClick(tgBack); }
    TGA.cloud=w.isVersionAtLeast('6.9');
  }catch(e){}
  tgCloudLoad();
}
// имя из профиля Telegram — подсказка при создании бойца (если подходит под шрифт)
function tgName(){ const u=TGA.app&&TGA.app.initDataUnsafe&&TGA.app.initDataUnsafe.user; return u?cleanName(u.first_name||''):''; }
// кнопка «Вибрация» на заставке — только в Telegram (вибрация есть только там)
function vibroBtn(){ const b=$('#btnVibro'); if(!b) return; b.style.display=TGA.app&&TGA.app.isVersionAtLeast&&TGA.app.isVersionAtLeast('6.1')?'':'none'; b.textContent='Вибрация: '+(S.vib!==false?'вкл':'выкл'); }
// вибрация на телефоне: по тем же событиям, что и звук
function tgHaptic(n){
  const w=TGA.app; if(!w||!w.isVersionAtLeast('6.1')||S.vib===false) return; // выключено кнопкой «Вибрация» (сборка 111)
  try{ const h=w.HapticFeedback;
    if(n==='tap'||n==='combo') h.impactOccurred('light'); else if(n==='hit') h.impactOccurred('medium'); else if(n==='miss') h.notificationOccurred('warning'); else if(n==='crit'||n==='ko') h.impactOccurred('heavy');
    else if(n==='coin'||n==='lvl') h.notificationOccurred('success'); else if(n==='lose') h.notificationOccurred('error'); }catch(e){}
}
// сохранение в облаке Telegram: прогресс переносится между телефонами и не теряется при очистке кэша
function tgCloudSave(json){
  if(!TGA.cloud) return;
  if(json.length>4096){ diag('облако',new Error('сохранение больше лимита Telegram 4096 символов — в облако не записано')); return; }
  TGA.pend=json; clearTimeout(TGA.timer); TGA.timer=setTimeout(tgCloudFlush,1500); // с 81-й сборки прогресс общий — одна запись
}
// отправить отложенную запись сейчас (игру свернули — таймер может не успеть)
function tgCloudFlush(){
  const json=TGA.pend; if(!json) return; TGA.pend=null; clearTimeout(TGA.timer);
  try{ TGA.app.CloudStorage.setItem('save',json,err=>{ if(err) diag('облако',new Error('запись: '+err)); }); }catch(e){ diag('облако',e); }
}
function tgCloudLoad(){
  if(!TGA.cloud) return;
  try{ TGA.app.CloudStorage.getItems(HEROES.map(h=>'save_h'+h.id),(err,vals)=>{ if(err||!vals) return; // прогресс других бойцов — если в облаке новее
    for(const h of HEROES){ const v=vals['save_h'+h.id]; if(!v) continue; try{ const d=JSON.parse(v), loc=JSON.parse(localStorage.getItem(heroKey(h.id))||'{}');
      if((+d.ts||0)>(+loc.ts||0)&&!(S.started&&S.hero===h.id)) localStorage.setItem(heroKey(h.id),v); }catch(e){} } }); }catch(e){}
  try{ TGA.app.CloudStorage.getItem('save',(err,val)=>{
    if(err){ diag('облако',new Error('чтение: '+err)); return; } if(!val) return;
    let d; try{ d=JSON.parse(val); }catch(e){ diag('облако',e); return; }
    whenIdle(()=>{ // начатый бой облако не подменяет — применим после
      if((+d.ts||0)<=(S.ts||0)) return; // в облаке не новее, чем на телефоне
      if(S.mh&&!d.mh) return; // в облаке — сохранение старой версии (до общего прогресса бойцов): не откатываемся и не переносим второй раз
      S=sanitize(d); addXp(0); mergeHeroes(); try{ localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }catch(e){ diag('сохранение',e); }
      applyExternal(); toast('Прогресс загружен из облака Telegram'); });
  }); }catch(e){ diag('облако',e); }
}
// системная кнопка «Назад» Telegram и подтверждение закрытия во время боя
function tgSyncBack(){
  const w=TGA.app; if(!w) return;
  const show=screen!=='title'||$('#modal').classList.contains('on')||$('#train').classList.contains('on'), conf=screen==='fight';
  try{
    if(show!==TGA.back&&w.isVersionAtLeast('6.1')){ TGA.back=show; show?w.BackButton.show():w.BackButton.hide(); }
    if(conf!==TGA.confirm&&w.isVersionAtLeast('6.2')){ TGA.confirm=conf; conf?w.enableClosingConfirmation():w.disableClosingConfirmation(); }
  }catch(e){}
}
function tgBack(){
  if($('#train').classList.contains('on')){ if(TR&&TR.state!=='run') closeTrain(); return; }
  if($('#modal').classList.contains('on')){ const b=$('#mbox [data-act="closemodal"]')||$('#mbox [data-act="closefight"]'); if(b) b.click(); return; }
  if(screen==='fight') ACT.surrender(); else if(screen==='hub') ACT.menu();
}

/* ---------- ДИАГНОСТИКА: ошибки на телефоне видны прямо в игре ----------
   Нажатие на номер сборки на заставке показывает сведения об устройстве; нажатие на панель — скрывает её. */
const BUILD='111 · 2026-10-31'; // номер сборки — видно на заставке, свежая версия или старая из кэша Telegram
let FRAMES=0, PRESENT_MODE='чёткий';
/* Сторож: раз в секунду, независимо от кадров. Если игра открыта, а кадры не идут — или бой стоит без открытых окон, —
   показываем панель ошибок с подробностями (по ней видно причину, например на ПК). */
const WD={frames:-1,still:0,ft:null,fstill:0,said:{}};
setInterval(()=>{ try{
  if(document.visibilityState!=='visible'){ WD.still=WD.fstill=0; WD.frames=FRAMES; return; }
  WD.still=FRAMES===WD.frames?WD.still+1:0; WD.frames=FRAMES;
  const modal=$('#modal').classList.contains('on')||$('#ad').classList.contains('on');
  const dv=document.getElementById('dvPanel'), fighting=screen==='fight'&&F&&F.state==='fight'&&!modal&&!(dv&&dv.classList.contains('on')); // открытая панель DEV ставит бой на паузу — это не ошибка
  WD.fstill=fighting&&F.time===WD.ft?WD.fstill+1:0; WD.ft=F?F.time:null;
  const info=()=>'экран '+screen+', бой: '+(F?F.state+', время '+Math.round(F.time)+', скорость '+F.speed+', стоп-кадр '+Math.round(F.hitstop):'нет')+', окно: '+(modal?'открыто':'нет')+', кадров '+FRAMES;
  if(WD.still>=3&&!WD.said.frames){ WD.said.frames=1; diag('сторож',new Error('кадры не идут 3 с — '+info())); }
  if(WD.fstill>=3&&!WD.said.fight){ WD.said.fight=1; diag('сторож',new Error('бой стоит 3 с — '+info())); }
}catch(e){} },1000);
const DIAG_SEEN={};
function diag(where,e){
  const m='['+where+'] '+(e&&e.message?e.message:String(e));
  if(DIAG_SEEN[m]) return; DIAG_SEEN[m]=1; (window.__errs=window.__errs||[]).push(m); console.error(m,e); showDiag();
}
function diagEnv(){
  const c=id=>{ const v=$(id); return v?v.width+'×'+v.height+' (css '+v.clientWidth+'×'+v.clientHeight+')':'—'; };
  const w=TGA.app;
  return 'Сборка '+BUILD+'\n'+navigator.userAgent+'\nэкран '+innerWidth+'×'+innerHeight+', dpr '+(window.devicePixelRatio||1)+', --app-h '+getComputedStyle(document.documentElement).getPropertyValue('--app-h')+
    '\nTelegram: '+(w?('Bot API '+w.version+', '+w.platform+', высота '+w.viewportStableHeight+', на весь экран: '+!!w.isFullscreen):'нет')+
    '\nзаставка '+c('#titleCv')+'\nбой '+c('#fightCv')+'\nвывод: '+PRESENT_MODE+', кадров: '+FRAMES+', экран: '+screen;
}
window.showDiag=function(force){
  const d=$('#diag'), errs=window.__errs||[]; if(!d||(!errs.length&&!force)) return;
  if(!force){ d.textContent='⚠ ошибка'; d.classList.add('on','min'); return; } // игроку — маленький значок, подробности по нажатию
  d.textContent=(errs.length?'ОШИБКИ:\n'+errs.slice(-6).join('\n')+'\n\n':'')+diagEnv()+'\n\n(нажмите, чтобы скрыть)'; d.classList.remove('min'); d.classList.add('on');
};
document.addEventListener('click',e=>{ const d=e.target.closest('#diag'); if(d){ if(d.classList.contains('min')) showDiag(true); else d.classList.remove('on'); } else if(e.target.closest('#build')) showDiag(true); });
$('#build').textContent='сборка '+BUILD; setTimeout(saveInfo,500);
// шаг кадра с отдельной защитой: ошибка в одной части (картинка, полоски, вывод) не гасит остальные
function step(name,fn){ try{ fn(); }catch(e){ diag(name,e); } }
// сторож имён: встроенный скрипт Telegram на iPhone перезаписал глобальное имя head (функцию рисования головы) элементом <head>.
// Запоминаем все функции игры при запуске; если какую-то подменили — возвращаем свою и пишем об этом в панель ошибок.
const OWN_FN={};
(function(){ const src=[].slice.call(document.scripts).map(s=>s.text).find(t=>t.indexOf('function renderFighter(')>=0)||'', re=/^function (\w+)\(/gm; let m;
  while((m=re.exec(src))) if(typeof window[m[1]]==='function') OWN_FN[m[1]]=window[m[1]]; })();
function checkNames(){ for(const n in OWN_FN) if(window[n]!==OWN_FN[n]){ diag('имена','глобальное имя «'+n+'» было перезаписано ('+Object.prototype.toString.call(window[n])+') — восстановлено'); window[n]=OWN_FN[n]; } }

/* ---------- ЭКРАН: чёткие пиксели на любом телефоне ----------
   iPhone 14 … 18 Pro Max (390–440 CSS px, плотность 3×), Android (2–4×), планшеты.
   Игра рисует в маленький буфер (320×180), а на экран он выводится в физических пикселях устройства:
   сначала целое увеличение без сглаживания, затем точная подгонка — все «пиксели» одного размера.
   Если чёткий вывод на устройстве падает или рисует пустоту — игра сама переходит на простой (растяжение буфера). */
const UP=document.createElement('canvas'), upg=UP.getContext('2d');
// crop: показать середину буфера по ширине под пропорции холста (арена боя крупнее — края сцены обрезаются, пиксели не растягиваются)
let FV={x:0,w:W}; // видимая часть буфера боя по ширине — для всплывающих надписей
function viewOf(buf,cv,crop){
  const cw=cv.clientWidth, ch=cv.clientHeight;
  if(!crop||!cw||!ch) return {x:0,w:buf.width};
  const vw=Math.min(buf.width,Math.max(140,Math.round(buf.height*cw/ch)));
  return {x:(buf.width-vw)>>1,w:vw};
}
function present(buf,cv,crop){
  if(PRESENT_MODE!=='чёткий') return presentSimple(buf,cv,crop);
  try{
    const cw=cv.clientWidth, ch=cv.clientHeight; if(!cw||!ch) return; // размер без учёта анимаций (transform)
    const d=window.devicePixelRatio||1, w=Math.round(cw*d), h=Math.round(ch*d), v=viewOf(buf,cv,crop); if(crop&&cv.id==='fightCv') FV=v;
    if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
    const k=Math.max(1,Math.ceil(w/v.w)), uw=v.w*k, uh=buf.height*k;
    if(UP.width!==uw||UP.height!==uh){ UP.width=uw; UP.height=uh; }
    upg.imageSmoothingEnabled=false; upg.clearRect(0,0,uw,uh); upg.drawImage(buf,v.x,0,v.w,buf.height,0,0,uw,uh);
    const g=cv.getContext('2d'); g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high'; g.drawImage(UP,0,0,w,h);
    if((cv.__checks=(cv.__checks||0)+1)<=3){ // первые кадры: проверяем, что на экран реально что-то попало
      const px=g.getImageData(w>>1,h>>1,1,1).data;
      if(px[3]===0) throw new Error('чёткий вывод дал пустой кадр');
    }
  }catch(e){ diag('вывод',e); PRESENT_MODE='простой'; presentSimple(buf,cv,crop); }
}
function presentSimple(buf,cv,crop){
  try{
    const v=viewOf(buf,cv,crop); if(crop&&cv.id==='fightCv') FV=v;
    if(cv.width!==v.w||cv.height!==buf.height){ cv.width=v.w; cv.height=buf.height; }
    const g=cv.getContext('2d'); g.imageSmoothingEnabled=false; g.drawImage(buf,v.x,0,v.w,buf.height,0,0,v.w,buf.height);
  }catch(e){ diag('вывод-запасной',e); }
}
// масштаб пиксельных надписей: не больше maxK и такой, чтобы 1 пиксель шрифта = целое число физических точек
function crispK(cssW,avail,maxK){
  const d=window.devicePixelRatio||1, lo=Math.ceil(d); let n=Math.floor(maxK*d);
  while(n>lo&&cssW*n/d>avail) n--;
  return n/d;
}
// высота игры: в Telegram — стабильная высота его окна, в браузере — видимая часть (адресная строка iOS не обрезает низ)
function fitViewport(){
  const w=TGA.app, h=w&&w.viewportStableHeight?w.viewportStableHeight:window.innerHeight;
  if(h>0) document.documentElement.style.setProperty('--app-h',Math.round(h)+'px');
}
window.addEventListener('resize',fitViewport);
window.addEventListener('orientationchange',()=>setTimeout(fitViewport,250));
if(window.visualViewport) window.visualViewport.addEventListener('resize',fitViewport);

/* ---------- СТАРТ ---------- */
loadHeroes(); emoStart();
// свободные шрифты встроены, но грузятся асинхронно: после загрузки перерисовать то, что уже нарисовано на холстах (фоны арен с надписями)
if(document.fonts&&document.fonts.load) Promise.all([document.fonts.load("bold 8px 'SC Text'"),document.fonts.load("8px 'SC Arcade'")]).then(()=>{ BG.length=0; if(typeof renderHub==='function'&&screen==='hub') renderHub(); }).catch(e=>diag('шрифты',e));
const hasSave=loadSave();
$('#btnContinue').style.display=hasSave?'':'none';
$('#btnSound').textContent='Звук: '+(S.sound?'вкл':'выкл'); vibroBtn();
tgInit(); // если SDK Telegram уже загрузился
fitViewport();
requestAnimationFrame(loop);
</script>
