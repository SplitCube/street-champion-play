<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0a1a">
<title>Уличный чемпион: карьера</title>
<style>html,body{margin:0;height:100%;background:#05040a;color:#ffd23f;font:bold 16px "Lucida Console","Courier New",monospace;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<div>Загрузка…</div>
<script>
/* Загрузчик: всегда открывает самую свежую сборку игры, даже если эта страница взята из кэша.
   version.json запрашивается с уникальным параметром — его кэш не перехватит. Параметры запуска Telegram сохраняются. */
(function(){
  var tail=location.search+location.hash;
  function go(file){ location.replace(file+tail); }
  fetch('version.json?t='+Date.now(),{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(v){ go(v&&v.file?v.file:'game.html'); })
    .catch(function(){ go('game.html'); });
})();
</script>
</body>
</html>
