/* Сборка 129: капа (🦷), кроссовки (👟) и бинты (новая клетка 🧻) — пиксельные рисунки пользователя. Значки (сборка 108): Microsoft Fluent Emoji, плоский стиль — © Microsoft Corporation, лицензия MIT (github.com/microsoft/fluentui-emoji); ☰ — свой.
   Спрайт 93 клетки 48×48, растеризован из SVG.
   Эмодзи в тексте игры заменяются картинками из спрайта (emojify) — системные эмодзи телефона не используются. */
.em{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.28em;background:var(--emo) no-repeat;background-size:9400% 100%;font-style:normal}
:root{--bg:#0d0a1a;--panel:#1a1430;--panel2:#261d45;--line:#3d2f6b;--txt:#f1e9ff;--dim:#ada0d2;--red:#ff3b4f;--yel:#ffd23f;--grn:#3ee07a;--cyan:#38e8ff;--mag:#ff4fd8;--org:#ff8a2b;
  /* безопасные зоны: вырез/Dynamic Island/полоска «Домой» и панели Telegram в полноэкранном режиме */
  --sat:max(env(safe-area-inset-top),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
  --sab:max(env(safe-area-inset-bottom),calc(var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px)))}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05040a;color:var(--txt);font-family:'SC Text','SC Sym',"Lucida Console","Courier New",monospace;font-synthesis:none;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
#app{position:relative;width:100%;max-width:520px;height:100%;height:100dvh;height:var(--app-h,100dvh);margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 3px #000,0 0 40px #2a1450}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 16px;overscroll-behavior:contain}
.btn{display:block;width:100%;background:var(--panel2);border:3px solid #000;padding:11px 10px;min-height:46px;font-size:14px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),inset 3px 3px 0 rgba(255,255,255,.14);position:relative}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 3px 3px 0 rgba(0,0,0,.4)}
.btn:disabled{opacity:.45;cursor:default}
.btn.red{background:#b3122a}.btn.grn{background:#1e8a47}.btn.yel{background:#c9940a;color:#140c00}.btn.cyan{background:#137c92}.btn.mag{background:#8f1d7c}
.btn.sm{display:inline-block;width:auto;min-height:36px;padding:6px 10px;font-size:12px}
.row{display:flex;gap:8px;align-items:center}
.gap{height:10px}
.card{background:var(--panel);border:3px solid #000;box-shadow:inset 0 0 0 2px var(--line);padding:10px;margin-bottom:10px}
.h{font-weight:bold;font-size:15px;text-transform:uppercase;color:var(--yel);letter-spacing:1px}
.h2{font-weight:bold;font-size:13px;text-transform:uppercase;color:var(--cyan);margin:4px 0 8px;letter-spacing:1px}
.dim{color:var(--dim);font-size:12px;line-height:1.45}
.bar{height:10px;background:#000;border:2px solid #000;position:relative;overflow:hidden;box-shadow:0 0 0 2px var(--line)}
.bar>i{position:absolute;left:0;top:0;bottom:0;display:block;transition:width .15s steps(4)}
.note{background:#3a2a00;border:3px solid #000;box-shadow:inset 0 0 0 2px var(--yel);color:var(--yel);padding:8px 10px;font-size:12px;margin-bottom:10px;font-weight:bold;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{box-shadow:inset 0 0 0 2px #7a5a00}}
/* top bar */
.top{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 8px;align-items:center;padding:8px 10px;background:#120d24;border-bottom:3px solid #000;font-size:12px;padding-top:max(8px,var(--sat))}
.chip{background:#000;padding:3px 6px;border:2px solid var(--line);white-space:nowrap;font-weight:bold}
button.chip{font:inherit;font-weight:bold;cursor:pointer;position:relative;min-height:36px} /* под палец: меню и «📋 ДЕНЬ N» */
.gear .btn.sm{min-height:42px} /* «⬆», «✦», «Надеть», продажа — под палец */
.hofds{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.hofd{display:grid;grid-template-columns:42% 1fr;gap:8px;align-items:center;min-width:0}
.hofd canvas{width:100%;height:auto;display:block;image-rendering:pixelated}
.hofd div{min-width:0;font-size:11px;line-height:1.3}
.hofd b{display:block;font-size:12px}
.hofd i{display:block;font-style:normal;font-weight:bold}
.hofd small{display:block;color:var(--dim)}
.hof{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.hof div{text-align:center;font-size:9px;color:var(--dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hof canvas{width:100%;height:auto;display:block;image-rendering:pixelated}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.badge{background:var(--panel2);border:2px solid #000;box-shadow:inset 0 0 0 2px var(--yel);padding:4px 2px;text-align:center;font-size:10px;font-weight:bold}
.badge b{display:block;font-size:20px;line-height:1.2}.badge small{display:block;font-weight:normal;color:var(--dim);font-size:9px}
.badge.off{opacity:.35;filter:grayscale(1);box-shadow:none}
.badge .bt{font-size:9px;text-transform:uppercase;margin-top:2px}.badge .br{color:var(--yel)!important;margin-top:2px}
.badge.rdy{box-shadow:inset 0 0 0 2px var(--grn)}.badge .btn{margin-top:4px;min-height:32px;padding:4px;font-size:10px}
.card.tree.act{box-shadow:inset 0 0 0 2px var(--yel)}
.card.tree.lock{opacity:.6}
.card.tree .gear .btn.sm{min-width:48px} /* «+» навыка — под палец */
.chip .dot{position:absolute;top:-5px;right:-5px;width:10px;height:10px;background:var(--red);border:2px solid #000;display:none}
.chip.has .dot{display:block}
.streak{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:6px 0}
.s7{display:flex;align-items:center;gap:10px;margin:0 0 6px;padding:8px 10px;background:#2a1450;border:2px solid #000;box-shadow:inset 0 0 0 2px #c060ff}
.s7 .ic{font-size:32px;line-height:1}.s7 .ic .em{width:36px;height:36px}.s7 small{display:block;font-size:11px;color:var(--dim);text-transform:uppercase}.s7 b{color:#d9a2ff;font-size:15px}
.s7.got{background:#1f3a2a;box-shadow:inset 0 0 0 2px #3ee07a}.s7.now{animation:blink7 1s steps(2) infinite}
@keyframes blink7{50%{box-shadow:inset 0 0 0 2px var(--yel)}}
.chest{position:relative;height:230px;margin:4px 0 8px;overflow:hidden;border:2px solid #000;background:radial-gradient(ellipse at 50% 45%,#3a1d63 0%,#1a1430 60%,#120d24 100%)}
.chest .beams{position:absolute;left:50%;bottom:78px;width:0;height:0}
.chest .beam{position:absolute;left:-15px;bottom:0;width:30px;height:250px;transform-origin:50% 100%;transform:rotate(var(--a)) scaleY(0);background:linear-gradient(to top,var(--c) 0%,var(--c) 65%,transparent 100%);clip-path:polygon(42% 100%,58% 100%,100% 0,0 0);opacity:.8;transition:transform .45s steps(5)}
.chest.open .beam{transform:rotate(var(--a)) scaleY(1);animation:bglow .45s steps(2) infinite}.chest.stop .beam{animation:none;opacity:.7}
@keyframes bglow{50%{opacity:.45}}
.chest .cw{position:absolute;inset:0}.chest.shake .cw{animation:cshk .1s steps(2) infinite}@keyframes cshk{50%{transform:translateX(3px)}}
.chest .cbox{position:absolute;left:50%;bottom:20px;width:116px;height:60px;margin-left:-58px;background:#7a4a1e;border:3px solid #000;box-shadow:inset 0 -9px 0 #5a3412,inset 0 0 0 3px #a8692c}
.chest .cbox:before{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:14px;margin-left:-7px;background:#e0b030;border-left:3px solid #000;border-right:3px solid #000}
.chest .cbox:after{content:'';position:absolute;left:50%;top:6px;width:18px;height:18px;margin-left:-9px;background:#ffd23f;border:3px solid #000}
.chest .clid{position:absolute;left:50%;bottom:80px;width:122px;height:32px;margin-left:-61px;background:#8a5524;border:3px solid #000;border-radius:16px 16px 0 0;box-shadow:inset 0 0 0 3px #b07434;transform-origin:3px 100%;transition:transform .3s steps(4)}
.chest .clid:before{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:14px;margin-left:-7px;background:#e0b030;border-left:3px solid #000;border-right:3px solid #000}
.chest.open .clid{transform:rotate(-38deg)}
.chest .cit{position:absolute;left:50%;top:22px;width:80px;height:80px;margin-left:-40px;display:grid;place-items:center;font-size:46px;line-height:1;background:#0b0818;border:3px solid #c060ff;box-shadow:inset 0 0 0 2px #000,0 3px 0 #000;opacity:0;transform:translateY(70px) scale(.3);transition:opacity .3s,transform .4s}
.chest .cit .em{width:50px;height:50px}.chest .cit>span{display:none}.chest .cit>span.on{display:block}
.chest.open .cit{opacity:1;transform:none}.chest.stop .cit{animation:pop .25s steps(3);box-shadow:inset 0 0 0 2px #000,0 0 0 3px var(--yel)}
.ctx{text-align:center;margin-bottom:8px;visibility:hidden}.ctx.on{visibility:visible}.ctx b{color:#d9a2ff;font-size:16px}
.sday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;background:var(--panel2);border:2px solid #000;font-size:11px}
.sday span{font-size:15px}.sday.got{background:#1f4a2a;box-shadow:inset 0 0 0 2px #3ee07a}.sday.now{box-shadow:inset 0 0 0 2px var(--yel);animation:blink 1s steps(2) infinite}
.lv{color:var(--yel)}.money{color:var(--grn)}.day{color:var(--cyan)}
.xpw{min-width:0}.xpw .bar{height:8px}
.enw{grid-column:1/-1;display:flex;align-items:center;gap:8px}.enw .bar{flex:1}
.enw .ent{font-size:10px;color:var(--dim);white-space:nowrap}
.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:3px solid #000;background:#120d24;padding-bottom:var(--sab)}
.nav button{background:none;border:none;border-right:2px solid #000;padding:9px 2px 8px;font-size:11px;font-weight:bold;text-transform:uppercase;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px}
.nav button:last-child{border-right:none}
.nav button.on{color:var(--yel);background:#1f1640;box-shadow:inset 0 3px 0 var(--yel)}
.nav .ic{font-size:18px;line-height:1}
.nav button{position:relative}
.nav .dot{position:absolute;top:5px;left:calc(50% + 8px);width:10px;height:10px;background:var(--red);border:2px solid #000;display:none}
.nav button.has .dot{display:block}
#fightbar{padding:6px 10px;background:#120d24;border-top:3px solid #000}
#fightbar:empty{display:none}
.fbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--red);color:#fff;border:3px solid #000;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),3px 3px 0 #000;padding:8px 10px;font:inherit;font-weight:bold;font-size:16px;text-transform:uppercase;text-align:left;cursor:pointer}
.fbtn .fst{display:block;font-size:11px;font-weight:normal;text-transform:none;opacity:.92;margin-top:2px}
.fbtn .pct{flex:none;font-size:20px;background:#000;padding:3px 8px;border:2px solid currentColor}
.ibtn{display:inline-grid;place-items:center;width:20px;height:20px;margin-left:6px;vertical-align:middle;background:#000;color:var(--cyan);border:2px solid var(--cyan);font-weight:bold;font-size:12px;line-height:1;padding:0;cursor:pointer;text-transform:none;letter-spacing:0}
.chance{font-size:16px}
.fbrow{display:flex;gap:6px}.fbrow .fbtn{flex:1;min-width:0}.fbrow .fbtn.farm{flex:0 0 36%;background:#1e8a47}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px}
.seg button{background:var(--panel2);color:var(--dim);border:2px solid #000;padding:8px 2px;font:inherit;font-size:11px;font-weight:bold;cursor:pointer}
.seg button.on{background:#1f1640;color:var(--yel);box-shadow:inset 0 -3px 0 var(--yel)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.srow{margin:8px 0 10px;font-size:12px;line-height:1.8}
.srow .btn{display:inline-block;width:auto;margin-left:4px}
#diag.min{left:auto;right:6px;bottom:auto;top:calc(96px + var(--sat));max-height:none;padding:4px 8px;font-size:13px;font-weight:bold;overflow:hidden;white-space:nowrap}
#saveInfo{margin-top:6px;color:var(--dim)}
/* hub */
.hero{display:flex;gap:10px;align-items:center}
.hero canvas{width:96px;height:96px;background:#0a0716;border:3px solid #000;box-shadow:inset 0 0 0 2px var(--line);flex:none}
.stat{display:grid;grid-template-columns:1fr auto 40px;gap:4px 8px;align-items:center;padding:7px 0;border-bottom:2px dashed #2b2150}
.stat:last-child{border-bottom:none}
.stat .v{font-size:18px;font-weight:bold;color:var(--yel);min-width:28px;text-align:right}
.stat .bar{grid-column:1/3;height:6px}
.plus{width:40px;height:36px;grid-row:1/3;grid-column:3;background:#1e8a47;border:3px solid #000;font-size:20px;font-weight:bold;box-shadow:inset -2px -2px 0 rgba(0,0,0,.4)}
.plus:disabled{background:#2a2440;opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kv{background:#0e0a1e;border:2px solid #000;padding:6px 8px;font-size:12px}
.kv b{display:block;font-size:15px;color:var(--txt)}
.kv span{color:var(--dim)}
.tcard{display:flex;gap:10px;align-items:center;background:var(--panel);border:3px solid #000;box-shadow:inset 0 0 0 2px var(--line);padding:10px;margin-bottom:8px;width:100%;text-align:left}
.tcard.deal{box-shadow:inset 0 0 0 2px var(--grn)}
.tcard .dtag{font-size:10px;color:#000;background:var(--grn);padding:1px 4px;text-transform:none;white-space:nowrap}
.tcard .ico{font-size:26px;width:42px;height:42px;display:grid;place-items:center;background:#0b0818;border:2px solid #000;flex:none}
.tcard .tx{flex:1;min-width:0}
.tcard .nm{font-weight:bold;text-transform:uppercase;font-size:13px}
.tcard .bar{height:6px;margin-top:5px}
.tcard .cost{font-size:12px;color:var(--cyan);font-weight:bold;white-space:nowrap}
.tcard:active{transform:translateY(2px)}
.tcard:disabled{opacity:.45;filter:grayscale(.6)}
.tcard:disabled:active{transform:none}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.slot{background:#0b0818;border:3px solid #000;box-shadow:inset 0 0 0 2px var(--mag);min-height:48px;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:bold;padding:4px;text-transform:uppercase}
.slot.empty{box-shadow:inset 0 0 0 2px #2b2150;color:#4b3f7a}
.mv{background:var(--panel);border:3px solid #000;box-shadow:inset 0 0 0 2px var(--line);padding:10px;margin-bottom:8px}
.mv.sel{box-shadow:inset 0 0 0 2px var(--mag)}
.mv .t{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mv .nm{font-weight:bold;text-transform:uppercase}
.tag{font-size:10px;padding:2px 5px;border:2px solid #000;font-weight:bold;text-transform:uppercase}
.tag.atk{background:#7a1020}.tag.def{background:#10507a}.tag.duo{background:#8f1d7c;color:#fff;vertical-align:middle}
.mvst{display:flex;gap:10px;font-size:11px;color:var(--dim);margin:6px 0;flex-wrap:wrap}
.mvst b{color:var(--txt)}
.opp{display:flex;gap:10px;align-items:center;background:var(--panel);border:3px solid #000;box-shadow:inset 0 0 0 2px var(--line);padding:8px;margin-bottom:8px}
.opp canvas{width:80px;height:80px;background:#0a0716;border:2px solid #000;flex:none}
.opp .tx{flex:1;min-width:0}
.opp .nm{font-weight:bold;text-transform:uppercase;font-size:13px}
.opp.lock{opacity:.6}.opp.lock canvas{filter:brightness(.3)}
.opp.next{box-shadow:inset 0 0 0 2px var(--red);animation:pulse 1.2s steps(2) infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 2px #6a0e1c}}
.opp.done .nm::after{content:" ✓";color:var(--grn)}
.opp .btn{width:auto;min-height:40px;padding:6px 10px;font-size:12px}
.opp .obtns{display:flex;flex-direction:column;gap:6px}.opp .obtns .btn{width:100%}
.ostat{font-size:11px;color:var(--dim);margin-top:3px}
/* title */
#scr-title{justify-content:flex-start;background:#07050f;padding-top:var(--sat);padding-bottom:var(--sab)}
#titleCv{width:100%;flex:1 1 0;min-height:calc(min(100vw,520px)*.5625);max-height:calc(min(100vw,520px)*1.25);box-shadow:0 3px 0 #000} /* сцена занимает свободное место (края обрезаются, не растягивается); тень вместо рамки */
#scr-title .menu{margin-bottom:0}
.logo{text-align:center;padding:14px 10px 6px}
.logo .a{font-size:30px;font-weight:bold;color:var(--yel);letter-spacing:2px;line-height:1.05;text-shadow:3px 0 #000,-3px 0 #000,0 3px #000,0 -3px #000,4px 4px 0 var(--red),6px 6px 0 #000}
.logo .b{font-size:18px;font-weight:bold;color:var(--cyan);letter-spacing:6px;margin-top:8px;text-shadow:2px 2px 0 #000}
.menu{padding:10px 18px;display:flex;flex-direction:column;gap:9px;max-width:360px;width:100%;margin:0 auto}
.foot{text-align:center;font-size:10px;color:#4b3f7a;padding:8px}
/* fight */
#scr-fight{background:#000}
.hud{display:block;padding:6px 8px;background:#0b0818;border-bottom:3px solid #000;padding-top:max(6px,var(--sat))}
.hud.ohud{padding-top:6px;border-bottom:0;border-top:3px solid #000}
.side .nm{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.side.r .nm{margin-left:auto}
.side.r{text-align:right}
.side{display:flex;gap:8px;align-items:center;min-width:0}.sb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.nmrow{width:100%;display:flex;min-height:14px}.side.r .nmrow{justify-content:flex-end}
.face{width:54px;height:54px;flex:none;border:2px solid #000;box-shadow:0 0 0 2px var(--line);background:#1a1430}
/* сборка 125: здоровье — красный клин во всю ширину (толстый у портрета, сужается к краю), под ним с того же края — стамина вдвое короче */
.side .bar{background:#1a1410;box-shadow:none;margin:0;border:0}
.side .bar.hp{height:18px;width:100%;background:#2a0c12;clip-path:polygon(0 0,100% 28%,100% 72%,0 100%)}
.side.r .bar.hp{clip-path:polygon(0 28%,100% 0,100% 100%,0 72%)}
.strow{display:flex;align-items:center;gap:6px}.side.r .strow{justify-content:flex-end}
.side .bar.st{height:8px;width:50%;flex:none;background:#2a1a08;clip-path:polygon(0 0,100% 25%,100% 75%,0 100%)}
.side.r .bar.st{clip-path:polygon(0 25%,100% 0,100% 100%,0 75%)}
.stn{font-size:9px;line-height:1;color:#f0c070;white-space:nowrap;text-shadow:1px 1px 0 #000}
.side .bar.hp .num{justify-content:flex-start;padding-left:8px}.side.r .bar.hp .num{justify-content:flex-end;padding-right:8px}
.side.r .bar>i{left:auto;right:0}
.hp .fill{background:linear-gradient(#ff9a9a 0 2px,#e8202f 2px 50%,#a8101e 50%)}
.hp .ghost{background:#fff6c0;opacity:.8}
.st .fill{background:linear-gradient(#ffd27a 0 2px,#f0a030 2px 50%,#c87818 50%)}
.hp.low .fill{animation:hplow .5s steps(2) infinite}
@keyframes hplow{50%{filter:brightness(1.6)}}
.bar .num{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;color:#fff;text-shadow:1px 0 #000,-1px 0 #000,0 1px #000,0 -1px #000;letter-spacing:.5px;white-space:nowrap}
.bar.st .num{font-size:9px}
/* таймер — круглый медальон, под ним номер волны (как «раунд 1 из 10») */
.ftimer{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:4;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.ftimer small{font-size:9px;font-weight:bold;color:#f0d890;letter-spacing:1px;text-shadow:1px 1px 0 #000;white-space:nowrap}
.ftimer span{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;color:#fff3c0;
  background:radial-gradient(circle at 50% 40%,#3a2a10 0 55%,#1a1206 56%);box-shadow:0 0 0 3px #c9940a,0 0 0 5px #5a3a08,0 0 0 7px #000;text-shadow:2px 2px 0 #000}
.awrap{position:relative;width:100%;aspect-ratio:6/5;max-height:40%;background:#000;overflow:hidden;cursor:pointer;touch-action:none}
.awrap canvas{width:100%;height:100%}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ft{position:absolute;transform:translate(-50%,-50%);font-weight:bold;font-size:16px;white-space:nowrap;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000;animation:rise .9s steps(9) forwards}
.ft.big{font-size:22px}
@keyframes rise{0%{margin-top:6px;opacity:1}15%{margin-top:-8px}100%{margin-top:-34px;opacity:0}}
#banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-60%);height:22%;width:auto;max-width:96%;pointer-events:none;display:none}
#banner.on{display:block;animation:popc .35s steps(4)}
#bigfx{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);height:15%;width:auto;max-width:96%;pointer-events:none;display:none}
#bigfx.on{display:block;animation:bfx .7s steps(7) forwards}
@keyframes bfx{0%{transform:translate(-50%,-50%) scale(2);opacity:0}20%{transform:translate(-50%,-50%) scale(1);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
@keyframes popc{0%{transform:translate(-50%,-60%) scale(2.2);opacity:0}100%{transform:translate(-50%,-60%) scale(1);opacity:1}}
@keyframes pop{0%{transform:scale(2.2);opacity:0}100%{transform:scale(1);opacity:1}}
.fctl{flex:1;display:flex;flex-direction:column;gap:8px;padding:8px 10px;background:var(--bg);min-height:0;overflow-y:auto;padding-bottom:max(8px,var(--sab))}
/* кнопки приёмов — крупные, по одной на приём, с зазором: по ним жмут в окнах комбо */
.chips{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:10px}
.fctl .chips{flex:1 1 auto;min-height:72px;max-height:150px}
.mchip{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:72px;background:var(--panel2);border:3px solid #000;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.45),inset 3px 3px 0 rgba(255,255,255,.12);text-align:center;padding:6px 2px;font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;color:var(--txt);
  touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden}
.mchip .ic{font-size:26px;line-height:1}
.mchip.on{box-shadow:inset 0 0 0 3px var(--yel),inset -3px -3px 0 rgba(0,0,0,.45);color:var(--yel)}
/* комбо-связка: приём, который надо нажать сейчас, пульсирует, полоска снизу — время на нажатие */
.mchip.cw{background:#00b8d8;color:#04121a;box-shadow:inset 0 0 0 3px #fff;animation:cwp .3s steps(2) infinite}
.mchip.cw::after{content:'';position:absolute;left:0;bottom:0;height:7px;width:var(--cw,100%);background:#fff;box-shadow:0 -2px 0 #04121a}
.mchip.bad{background:#b3122a;color:#fff;box-shadow:inset 0 0 0 3px #ff5a6a}
.mchip:active{transform:translateY(2px)}
@keyframes cwp{50%{box-shadow:inset 0 0 0 3px #38e8ff;background:#38e8ff}}
.adr .cmb{min-width:44px;text-align:right;color:#38e8ff}
#cmbHint{display:flex;align-items:center;justify-content:center;gap:5px;height:32px;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden}
#cmbHint .st{display:inline-grid;place-items:center;width:32px;height:28px;border:2px solid #000;background:var(--panel2);font-size:16px;line-height:1}
#cmbHint .st.ok{background:#1f7a3a;box-shadow:inset 0 0 0 2px #3ee07a}
#cmbHint .st.now{background:#00b8d8;box-shadow:inset 0 0 0 2px #fff;animation:cwp .3s steps(2) infinite}
#cmbHint .ar{color:var(--dim);font-size:11px}
#cmbHint b{color:#38e8ff}
.adr{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:bold;color:var(--org)}
.adr .bar{flex:1;height:12px}
.adr .fill{background:linear-gradient(90deg,#ff8a2b,#ffd23f)}
.adr.full .fill{background:#fff;animation:fl .3s steps(2) infinite}
@keyframes fl{50%{background:var(--yel)}}
@media (max-height:780px){.awrap{max-height:33%}}
@media (max-height:700px){.fctl .hint{display:none}.fctl{gap:6px}}
@keyframes fl2{50%{background:#ffd23f}}
/* автобатлер: дорожка волн этапа (10 волн + босс) */
.waves{display:grid;grid-template-columns:repeat(10,1fr) 2fr;gap:3px}
.waves i{height:20px;background:#1a1430;border:2px solid #000;box-shadow:inset 0 0 0 1px #2b2150;font-style:normal;font-size:10px;font-weight:bold;line-height:16px;text-align:center;color:var(--dim)}
.waves i.done{background:#1f6a2a;color:#fff}
.waves i.cur{background:var(--yel);color:#140c00;animation:fl2 .6s steps(2) infinite}
.waves i.boss{background:#4a0c18;color:#ffd23f}
.waves i.boss.cur{background:var(--red);color:#fff;animation:none}
.waves i.lost{background:#5a0e1a;color:#fff}
.waves i.skip{background:#14101e;color:#4a4060;box-shadow:inset 0 0 0 1px #241c36}
.gear{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:2px dashed #2b2150}
.gear .gic{font-size:20px;width:26px;text-align:center}
.gear .gtx{flex:1;min-width:0;display:flex;flex-direction:column;font-size:12px}
.gear .gtx small{color:var(--dim);font-size:11px}
.gear .btn{min-height:32px;padding:4px 8px;width:auto}
.ggrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 6px}
.ggrid.eq{grid-template-columns:repeat(4,1fr)}
.doll{position:relative;height:290px;margin:4px 0 6px;border:2px solid #000;background:radial-gradient(ellipse at 50% 35%,#2e2356 0%,#1a1430 55%,#120d24 100%);overflow:hidden}
.doll .dfloor{position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(#1c1533,#100b1f);border-top:2px solid var(--line)}
.doll canvas{position:absolute;left:50%;top:14px;width:160px;height:264px;margin-left:-80px;image-rendering:pixelated}
.doll svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.doll polyline{fill:none;stroke:var(--yel);stroke-width:2;stroke-dasharray:4 3;opacity:.7}
.dslot{position:absolute;width:70px;text-align:center}.dslot.l{left:6px}.dslot.r{right:6px}
.dslot .gt{width:62px;margin:0 auto}.dslot .gt .em{width:40px;height:40px;vertical-align:middle}
.dslot b{display:block;font-size:10px;color:var(--dim);text-transform:uppercase;margin-top:3px}
.dslot i{display:block;font-style:normal;font-size:10px}
.dsum{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 4px}.dsum span{background:#0b0818;border:2px solid #000;padding:2px 6px;font-size:12px}.dsum b{color:var(--grn)}
.gt{position:relative;aspect-ratio:1;min-height:44px;padding:0;background:var(--panel2);border:3px solid #3a2f66;box-shadow:inset 0 0 0 2px #000,0 2px 0 #000;font-size:24px;line-height:1;display:grid;place-items:center;cursor:pointer;font-family:inherit}
.gt.empty{opacity:.4;filter:grayscale(1)}
.gt.sel{outline:3px solid #fff;outline-offset:1px}
.gt .lv{position:absolute;left:3px;bottom:2px;font-size:11px;font-style:normal;font-weight:bold;color:#fff;text-shadow:1px 0 #000,-1px 0 #000,0 1px #000,0 -1px #000}
.gt .up{position:absolute;right:3px;top:2px;font-size:13px;color:var(--grn);text-shadow:1px 1px 0 #000}
.gt .wr{position:absolute;right:2px;bottom:1px;font-size:11px}
@keyframes hlp{0%,100%{box-shadow:0 0 0 0 #fff0}50%{box-shadow:0 0 0 4px #fff,0 0 14px 6px #ffd23f}}
.btn.hl,.fbtn.hl{animation:hlp .6s steps(3) 4;position:relative;z-index:2}
.grow2{display:flex;gap:6px;margin-bottom:6px}.grow2 .btn{flex:1}
.loot{font-size:12px;text-align:left;margin:6px 0;line-height:1.5}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;background:#1a1430;border:3px solid #000;box-shadow:inset 0 0 0 2px #3d2f6b;color:var(--txt);padding:6px 2px;font:inherit;cursor:pointer;min-width:0}
.pick img{image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%;object-fit:contain}
.pick b{font-size:12px;white-space:nowrap}
.pick small{font-size:10px;color:var(--dim)}
.pick.on{box-shadow:inset 0 0 0 3px var(--yel);background:#2a1f00}
.btn.rage{background:#3a1a0a;color:#ff8a2b;min-height:44px;box-shadow:inset 0 0 0 2px #5a2a10}
.rrow{display:flex;gap:6px;align-items:stretch}
.rrow .rage{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbtn{position:relative;flex:none;width:48px;min-height:44px;background:var(--panel2);border:3px solid #000;box-shadow:inset 0 0 0 2px #3ee07a;font-size:20px;line-height:1;padding:0;color:#fff}
.cbtn b{position:absolute;right:3px;bottom:2px;font-size:10px;color:#3ee07a}
.cbtn:disabled{opacity:.5;box-shadow:inset 0 0 0 2px var(--line)}
.cbtn.none{opacity:.3}
.cbtn:active{transform:translateY(2px)}
.btn.rage.ready{background:#b3122a;color:#fff;box-shadow:inset 0 0 0 2px var(--org);animation:fl2 .8s steps(2) infinite}
.btn.rage.active{background:#ff8a2b;color:#140c00}
.btn.rage:disabled{opacity:1}
.style{padding:6px 0;border-bottom:2px dashed #2b2150;font-size:13px;color:var(--dim)}
.style b{color:var(--txt)}.style.on b{color:var(--grn)}
.style small{font-size:11px}
.runinfo{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:bold;color:var(--txt)}
.runinfo .money{color:var(--grn)}.runinfo .xp{color:var(--yel)}
.flog{font-size:11px;color:var(--dim);line-height:1.5;height:46px;overflow:hidden;flex:none;background:#07050f;border:2px solid #000;padding:5px 8px}
.fctl .flog{height:40px;line-height:1.35;padding:4px 8px;margin-top:auto} /* лог — две последние строки, место отдано кнопкам приёмов */
.flog div:first-child{color:var(--txt)}
#flog{display:none} /* сборка 127: строки лога во время боя убраны (просьба пользователя) */
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:10px;color:#6c5ea0;text-align:center}
/* выбор усиления «1 из 3» */
.perks{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.mbox{min-width:0}.mbox p,.perk b,.perk .dim{white-space:normal;overflow-wrap:anywhere} /* сборка 117: перенос на 360–480 px */
.perk{width:100%;min-width:0;box-sizing:border-box;display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;background:#1a1430;border:3px solid #000;box-shadow:inset 0 0 0 2px var(--yel);color:var(--txt);padding:9px 10px;font:inherit;cursor:pointer}
.perk .ic{grid-row:1/3;font-size:26px;text-align:center}
.perk b{font-size:14px;color:var(--yel)}
.perk .dim{font-size:12px}
.perk:active{filter:brightness(1.3)}
.perkrow{font-size:12px;color:var(--yel);text-align:center;margin:4px 0}
.frow.f3{grid-template-columns:1fr 1fr 1fr}
.power{color:var(--txt)}.power b{color:var(--org)}
div.power:not(.ostat){font-size:13px;margin-top:4px}
#autoBtn.on{box-shadow:inset 0 0 0 2px var(--grn);color:var(--grn)}
/* modal */
.modal{position:absolute;inset:0;background:rgba(5,3,12,.86);display:none;align-items:center;justify-content:center;padding:max(14px,var(--sat)) 14px max(14px,var(--sab));z-index:20}
.modal.on{display:flex}
.mbox{background:var(--panel);border:3px solid #000;box-shadow:inset 0 0 0 3px var(--line),8px 8px 0 #000;padding:16px;width:100%;max-width:400px;max-height:100%;overflow-y:auto;animation:pop .25s steps(3)}
.btn,.fbtn,.mbox .title,.h2,.logo,.tcard .nm,.nav button{font-family:'SC Arcade','SC Sym','SC Text',monospace}
.btn,.fbtn,.h2,.tcard .nm,.nav button{letter-spacing:.5px}
.btn.rage,.frow .btn{font-size:12px;white-space:nowrap}
.top .chip{white-space:nowrap}
.mbox .title{font-size:24px;line-height:1.3;font-weight:bold;text-align:center;margin-bottom:10px;letter-spacing:2px;text-shadow:3px 3px 0 #000}
.mbox p{font-size:13px;line-height:1.5;margin-bottom:8px}
.rew{display:flex;justify-content:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.rew div{background:#000;border:2px solid var(--line);padding:6px 10px;font-weight:bold}
#trCv{width:100%;aspect-ratio:16/9;box-shadow:0 0 0 3px #000;margin:3px 0;cursor:pointer;touch-action:none} /* тень вместо рамки — не искажает пропорции */
.trinfo{display:flex;justify-content:space-between;font-weight:bold;margin:8px 0 6px;font-size:14px}
.help h4{color:var(--cyan);margin:10px 0 4px;text-transform:uppercase;font-size:13px}
.help p,.help li{font-size:12px;line-height:1.5;color:#d8ccf5}
.help ul{padding-left:18px}
#ad{z-index:30}
#adSlot{min-height:200px;background:#000;border:3px solid #000;box-shadow:inset 0 0 0 2px var(--org);display:grid;place-items:center;overflow:hidden}
.adstub{text-align:center;color:var(--dim);font-size:13px;line-height:1.6;padding:16px}
.adstub b{display:block;font-size:20px;color:var(--org);margin-bottom:6px}
#rotate{display:none;position:fixed;inset:0;z-index:100;background:#05040a;color:var(--yel);font-weight:bold;font-size:18px;line-height:1.6;text-align:center;align-items:center;justify-content:center;padding:20px}
@media (orientation:landscape) and (max-height:500px){#rotate{display:flex}} /* телефон боком — игра рассчитана на вертикальный экран */
#diag{display:none;position:fixed;left:6px;right:6px;bottom:calc(6px + var(--sab));z-index:200;background:rgba(80,0,12,.94);color:#fff;font:11px/1.4 monospace;padding:8px;border:2px solid var(--red);max-height:50%;overflow:auto;white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text}
#diag.on{display:block}
#build{color:#6c5ea0;cursor:pointer}
#toast{position:absolute;left:50%;top:calc(70px + var(--sat));transform:translateX(-50%);background:#000;border:3px solid var(--yel);color:var(--yel);padding:8px 12px;font-size:13px;font-weight:bold;z-index:40;display:none;max-width:90%;text-align:center;box-shadow:4px 4px 0 #000}
#toast.on{display:block;animation:pop .2s steps(3)}
#tip{position:absolute;left:10px;right:10px;bottom:calc(150px + var(--sab));z-index:30;background:#0b0818;border:3px solid #000;box-shadow:inset 0 0 0 2px var(--cyan),4px 4px 0 #000;padding:10px 12px;display:none;font-size:13px;line-height:1.45}
#tip.on{display:block;animation:pop .2s steps(3)}
#tip.top{bottom:auto;top:calc(64px + var(--sat))}
#tip b{display:block;color:var(--cyan);margin-bottom:4px}
#tip ul{margin:0 0 8px;padding-left:18px}
#tip .btn{padding:8px}
.namein{display:block;width:100%;background:#000;color:var(--yel);border:3px solid #000;box-shadow:inset 0 0 0 2px var(--yel);padding:12px;font:bold 20px "Lucida Console","Courier New",monospace;text-align:center;text-transform:uppercase;letter-spacing:2px;user-select:text;-webkit-user-select:text;outline:none}
.namein:focus{box-shadow:inset 0 0 0 2px #fff}
.heroname{display:block;image-rendering:pixelated;image-rendering:crisp-edges;margin-bottom:6px}

:root{--bg:#2b2a2e;--panel:#1b1a1e;--panel2:#2a292e;--line:#3a383f;--txt:#f4f1e8;--dim:#a9a49b;--red:#e8162c;--yel:#ffcf1a;--grn:#b6ff3b;--cyan:#3be3ff;--mag:#ff3fa4;--org:#ff8a2b;
  --ink:#171619;--paper:#f4f1e8;--street:'SC Street','SC Body','SC Sym',sans-serif}
html,body{font-family:'SC Body','SC Sym','SC Text',sans-serif;background:#141316}
#app{background:repeating-linear-gradient(115deg,#ffffff05 0 2px,transparent 2px 7px),radial-gradient(circle at 20% 25%,#3a383e,#232226 70%);box-shadow:0 0 0 3px #000,0 0 40px #000}
.btn,.fbtn,.mbox .title,.h2,.logo,.tcard .nm,.nav button{font-family:'SC Body','SC Sym',sans-serif;font-weight:900}
/* светлая наклейка: внутри — тёмный текст, яркие цвета затемнены для читаемости на бумаге */
.card,.mbox{--txt:#1b1a1e;--dim:#5b5651;--yel:#b8620a;--grn:#178a3c;--cyan:#0b6f9c;--mag:#c0137a;--red:#d0142a;--org:#c25a00;--line:#cfc7b4;--panel:#ebe5d6;--panel2:#e2dbc9;color:var(--txt)}
.card{background:var(--paper);border:0;border-radius:4px;box-shadow:4px 4px 0 #000}
.h{font-family:var(--street);font-weight:400;font-size:18px;color:var(--red);letter-spacing:.5px;display:inline-block;transform:rotate(-1.5deg)}
.h2{font-family:var(--street);font-weight:400;font-size:16px;color:var(--red);display:inline-block;transform:rotate(-1.5deg);letter-spacing:.5px}
.dim{color:var(--dim)}
.bar{background:#111;border:0;border-radius:2px;box-shadow:none}
.card .bar{background:#d8d3c4}
.bar>i{background:repeating-linear-gradient(-45deg,#ffcf1a 0 6px,#ffb000 6px 12px)}
.note{background:var(--yel);color:var(--ink);border:0;box-shadow:3px 3px 0 #000;transform:rotate(.6deg);animation:none}
/* кнопки — плоские наклейки с жёсткой тенью */
.btn{background:#1b1a1e;color:var(--paper);border:2px solid #000;border-radius:3px;box-shadow:3px 3px 0 #000;letter-spacing:.5px}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.red{background:#e8162c;color:#fff}.btn.grn{background:#b6ff3b;color:#171619}.btn.yel{background:#ffcf1a;color:#171619}.btn.cyan{background:#3be3ff;color:#171619}.btn.mag{background:#ff3fa4;color:#fff}
.card .btn:not(.red):not(.grn):not(.yel):not(.cyan):not(.mag),.mbox .btn:not(.red):not(.grn):not(.yel):not(.cyan):not(.mag){background:#1b1a1e;color:var(--paper)}
/* верхняя плашка и меню */
.top{background:#171619;border-bottom:0;box-shadow:0 3px 0 #000}
.chip{background:var(--paper);color:var(--ink);border:0;border-radius:3px;box-shadow:2px 2px 0 #000;transform:rotate(-2deg)}
.top .chip.money{transform:rotate(1.5deg)}
.lv{color:#b8620a}.money{color:#178a3c}.day{color:#0b6f9c}
.top .chip.money{background:#b6ff3b}.top .chip.day{background:#3be3ff}
.top .lv,.top .money,.top .day{color:var(--ink)}
.chip .dot,.nav .dot{border-radius:50%}
.enw .ent{color:var(--dim)}
.nav{background:#171619;border-top:0;box-shadow:0 -3px 0 #000}
.nav button{border-right:0;color:#8d8a93}
.nav button.on{color:var(--ink);background:var(--yel);box-shadow:none;transform:rotate(-2deg)}
/* кнопка боя */
#fightbar{background:transparent;border-top:0}
.fbtn{background:#e8162c;border:0;border-radius:2px;box-shadow:5px 5px 0 #000;transform:skew(-5deg) rotate(-.8deg);font-family:var(--street);font-weight:400;font-size:20px}
.fbtn .fst{font-family:'SC Body';font-weight:600}
.fbtn .pct{background:#171619;color:#b6ff3b;border:0;font-family:'SC Body';font-weight:900}
.fbrow .fbtn.farm{background:#1b1a1e}
/* тёмные плитки-полоски (зал, приёмы, этапы) */
.tcard,.mv,.opp{background:#171619;border:0;border-left:6px solid var(--mag);border-radius:2px;box-shadow:3px 3px 0 #000}
.tcard.deal{border-left-color:var(--grn);box-shadow:3px 3px 0 #000}
.tcard .nm,.mv .nm,.opp .nm{color:var(--mag)}
.tcard .ico{background:#232226;border:0;border-radius:3px}
.mv.sel{border-left-color:var(--yel);box-shadow:3px 3px 0 #000,inset 0 0 0 2px var(--yel)}
.opp.next{border-left-color:var(--red);box-shadow:3px 3px 0 #000,inset 0 0 0 2px var(--red)}
@keyframes pulse{50%{box-shadow:3px 3px 0 #000,inset 0 0 0 2px #6a0e1c}}
.opp canvas{border:0;border-radius:2px}
.tag{border:0;border-radius:2px;color:#fff}.tag.atk{background:#e8162c}.tag.def{background:#1b7fd1}
.seg button{background:#1b1a1e;color:#8d8a93;border:0;border-radius:2px;box-shadow:2px 2px 0 #000}
.seg button.on{background:var(--yel);color:var(--ink);box-shadow:2px 2px 0 #000;transform:rotate(-1.5deg)}
.slot{background:#e2dbc9;color:var(--ink);border:0;border-radius:3px;box-shadow:inset 0 0 0 2px var(--mag)}
.slot.empty{box-shadow:inset 0 0 0 2px #cfc7b4;color:#9a937f}
.kv{background:#e8e2d2;border:0;border-radius:3px}
.kv b{color:var(--txt)}
.stat,.gear,.style{border-bottom:2px solid #1b1a1e1a}
.plus{background:#b6ff3b;color:#171619;border:2px solid #171619;border-radius:50%;box-shadow:2px 2px 0 #171619;width:38px;height:38px}
.plus:disabled{background:#d8d3c4;opacity:.6}
.badge{background:#e2dbc9;border:0;border-radius:3px;box-shadow:inset 0 0 0 2px var(--yel)}
.badge.rdy{box-shadow:inset 0 0 0 2px var(--grn)}
.s7{background:#1b1a1e;border:0;box-shadow:3px 3px 0 #000;--dim:#a9a49b}
.s7.got{background:#1f3a2a}.sday{background:#e2dbc9;border:0}.sday.got{background:#b6ff3b}
.gt{background:#e2dbc9;border:0;border-radius:3px;box-shadow:2px 2px 0 #00000055}
.dsum span{background:#e2dbc9;border:0}
.hero canvas{border:0;box-shadow:3px 3px 0 #000}
.waves i{background:#1b1a1e;border:0;border-radius:2px;box-shadow:none}
.waves i.done{background:#178a3c}.waves i.cur{background:var(--yel);color:var(--ink)}
.rew div{background:var(--ink);color:var(--paper);border:0;box-shadow:2px 2px 0 #000}
.perk{background:#1b1a1e;border:0;border-left:6px solid var(--yel);box-shadow:3px 3px 0 #000;color:var(--paper);--dim:#a9a49b}
.perk b{color:var(--yel)}
.mbox .perk b{color:#ffcf1a}
.pick{background:#1b1a1e;border:0;box-shadow:2px 2px 0 #000;color:var(--paper)}
.pick.on{background:#3a2a00;box-shadow:2px 2px 0 #000,inset 0 0 0 3px var(--yel)}
.ibtn{border-radius:50%;background:var(--ink);color:var(--cyan);border-color:var(--cyan)}
/* окна */
.modal{background:rgba(10,9,12,.84)}
.mbox{background:var(--paper);border:0;border-radius:4px;box-shadow:6px 6px 0 #000}
.mbox .title{font-family:var(--street);font-weight:400;color:var(--red)!important;text-shadow:none;transform:rotate(-1.5deg)}
.help p,.help li{color:#2e2b30}
.help h4{color:var(--red)}
#toast{background:var(--yel);color:var(--ink);border:0;border-radius:2px;box-shadow:3px 3px 0 #000}
#tip{background:var(--paper);color:#1b1a1e;border:0;border-left:6px solid var(--mag);box-shadow:4px 4px 0 #000}
#tip b{color:var(--red)}
.namein{background:#171619;color:var(--yel);border-radius:3px}
/* заставка */
#scr-title{background:#171619}
.logo .a{font-family:var(--street);font-weight:400;color:var(--yel);transform:rotate(-2deg);text-shadow:4px 4px 0 #000,0 0 0 #000}
.logo .b{font-family:'SC Body';font-weight:900;color:var(--ink);background:var(--cyan);display:inline-block;padding:2px 10px;letter-spacing:4px;transform:rotate(1.5deg);text-shadow:none;box-shadow:3px 3px 0 #000}
/* бой */
.hud{background:#171619;border-bottom:0;box-shadow:0 3px 0 #000}
.face{border:0;box-shadow:2px 2px 0 #000;border-radius:2px}
.stn{color:var(--yel)}
.hp .fill{background:#e8162c}.st .fill{background:#ffcf1a}.side .bar.hp{background:#3a0c12}
.ftimer span{border-radius:0;background:#e8162c;color:#fff;box-shadow:none;width:46px;height:46px;font-size:15px;transform:rotate(-6deg);
  clip-path:polygon(50% 0,61% 32%,98% 35%,68% 56%,79% 92%,50% 70%,21% 92%,32% 56%,2% 35%,39% 32%)}
.ftimer small{color:var(--yel)}
.fctl{background:transparent}
.mchip{background:#1b1a1e;border:0;border-radius:3px;box-shadow:3px 3px 0 #000}
.mchip.on{box-shadow:3px 3px 0 #000,inset 0 0 0 3px var(--yel)}
.mchip.cw{background:#3be3ff;color:#04121a;box-shadow:3px 3px 0 #000,inset 0 0 0 3px #fff}
.btn.rage{background:#1b1a1e;color:#ff8a2b;box-shadow:3px 3px 0 #000,inset 0 0 0 2px #5a2a10}
.btn.rage.ready{background:#e8162c;color:#fff}
.cbtn{background:#1b1a1e;border:0;border-radius:3px;box-shadow:2px 2px 0 #000,inset 0 0 0 2px #b6ff3b}
.flog{background:#141316;border:0;border-radius:2px}
#cmbHint .st{background:#1b1a1e;border:0;border-radius:2px}
@media (prefers-reduced-motion:reduce){.chip,.fbtn,.note,.h,.h2,.nav button.on{transform:none}}
.note[style*="opacity"]{opacity:1!important;background:#3a3840;color:#d8d3c4;transform:rotate(-.4deg)}
.doll{--dim:#a9a49b;--txt:#f4f1e8;--line:#3d2f6b;color:var(--txt)} /* сборка 130: линия пола тёмная, не белая */
.tcard .bar,.mv .bar,.opp .bar,.hud .bar{background:#2e2c33}
/* ▲ Стиль «Граффити» */

/* сборка 133: дерево навыков — три школы полосами слева направо; зажатие узла — подсказка сверху (#ttip) */
.tpts{text-align:center;margin:-4px 0 8px;font-size:12px;color:var(--dim)}.tpts b{color:var(--grn)}
.tlane{background:#1b1a1e;border:2px solid var(--c);margin-bottom:8px;padding:0 4px 6px;color:#f4f1e8;box-shadow:3px 3px 0 #000}
.tlane.lock{border-color:#3a383f}
.thead{display:flex;justify-content:space-between;align-items:center;gap:6px;width:calc(100% + 8px);margin:0 -4px 6px;padding:5px 8px;background:var(--c);color:#171619;border:0;font:inherit;font-size:11px;font-weight:900;text-transform:uppercase;cursor:pointer;text-align:left}
.thead span{font-size:10px;white-space:nowrap}.thead.sel{outline:3px solid #fff;outline-offset:-3px}
.tlane.lock .thead{background:#2e2c33;color:#8d8a93}
.trow2{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.trow2::before{content:'';position:absolute;left:26px;right:26px;top:27px;height:4px;background:var(--c);opacity:.55}
.tlane.lock .trow2::before{background:#3a383f}
.tn{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;width:calc(100% / 7) /* сборка 138: 7 узлов в школе */;min-width:0;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.tn em{display:flex;gap:2px;height:4px;font-style:normal}.tn em s{width:8px;height:4px;background:#3a383f;text-decoration:none}.tn em s.on{background:var(--c)}
.tn .tic{display:grid;place-items:center;width:36px;height:36px;background:#232226;border:3px solid #55525a;border-radius:3px;font-style:normal;font-weight:900;font-size:14px;color:#cfc8b8}
.tn.tmv .tic{font-size:16px}
.tn.cap .tic{width:42px;height:40px;margin-top:-2px;border:0;border-radius:0;clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%);background:#55525a;color:#cfc8b8}
.tn.part .tic,.tn.full .tic{background:var(--c);border-color:#171619;color:#171619}
.tn.can .tic{border-color:#ffcf1a;border-style:dashed}.tn.cap.can .tic{background:#ffcf1a;color:#171619}
.tn.sel .tic{outline:3px solid #fff;outline-offset:2px}.tn.press .tic{transform:scale(1.12);outline:3px solid #fff;outline-offset:3px}
.tn .tic .em{width:20px;height:20px;vertical-align:0}
.tn small{font-size:9px;font-weight:700;line-height:1.15;color:#d8d3c4;text-align:center;width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tlane.lock .tn .tic .em{width:20px;height:20px;vertical-align:0}
.tn small{color:#6f6c74}
.tinfo{border:2px solid #000;padding:8px 10px;margin:4px 0 8px;background:var(--panel2)}
.tinfo b{font-size:15px}.tinfo .tk{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--dim)}.tinfo p{font-size:12px;margin:4px 0 6px}
#ttip{position:absolute;z-index:60;display:none;background:#f4f1e8;color:#171619;border:2px solid #171619;border-radius:4px;box-shadow:4px 4px 0 #000;padding:8px 10px;font-size:12px;line-height:1.35;pointer-events:none}
#ttip.on{display:block;animation:pop .15s steps(2)}
#ttip::after{content:'';position:absolute;left:var(--ax,50%);bottom:-10px;margin-left:-9px;border:9px solid transparent;border-top-color:#171619;border-bottom:0}
#ttip.dn::after{bottom:auto;top:-10px;border-top:0;border-bottom:9px solid #171619}
#ttip b{font-size:14px}#ttip .tg{display:inline-block;background:#e8162c;color:#fff;font-size:9px;font-weight:800;padding:1px 6px;margin-left:6px;text-transform:uppercase;vertical-align:2px}
#ttip .ok{float:right;color:#178a3c;font-weight:800;font-size:11px}#ttip .no{float:right;color:#8a5a00;font-weight:800;font-size:11px}
/* сборка 134: вкладка «Приёмы» — две вкладки внутри, список приёмов с переключателями «в бою» */
.seg.two{grid-template-columns:1fr 1fr}.seg button{position:relative}
.seg .sdot{position:absolute;top:-4px;right:-3px;width:10px;height:10px;border-radius:50%;background:#e8162c;border:2px solid #171619}
.mvtop{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:2px 0 4px}
.mvtop .stl{background:#b6ff3b;color:#171619;font-size:10px;font-weight:900;text-transform:uppercase;padding:3px 7px;border-radius:2px;box-shadow:2px 2px 0 #000}
.mvr{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 10px;margin-bottom:6px;background:#1b1a1e;border:2px solid #2e2c33;border-radius:3px;box-shadow:3px 3px 0 #000}
.mvr.on{background:#3a3000;border-color:#ffcf1a}
.mvr{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}.mvr.press{border-color:#fff}
.mvr .mic{flex:none;width:28px;text-align:center;font-size:20px}.mvr .mic .em{width:22px;height:22px}
.mvr .tx{flex:1;min-width:0}.mvr .tx b{display:block;color:#f4f1e8;font-size:13px;text-transform:uppercase}
.mvr .tx small{display:block;color:#a9a49b;font-size:11px;line-height:1.3}
.mvr.lk .mic,.mvr.lk .tx b,.mvr.lk .tx small{opacity:.5}.mvr.lk .tx b{color:#8d8a93}
.mvr .mlock{flex:none;width:44px;text-align:center;opacity:.6}
.mvr .btn.sm{flex:none;width:auto;margin:0;padding-left:10px;padding-right:10px}
.tgl{flex:none;position:relative;width:48px;height:28px;border-radius:14px;border:0;padding:0;background:#3a383f;cursor:pointer;box-shadow:inset 0 0 0 2px #000}
.tgl .kn{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#8d8a93;transition:left .12s}
.tgl.on{background:#b6ff3b}.tgl.on .kn{left:24px;background:#171619}
.mvsep{border-top:2px dashed #55525a;margin:10px 0 8px}
#ttip .tst{display:flex;gap:4px;margin-top:6px}#ttip .tst span{flex:1;background:#e2dbc9;text-align:center;font-size:9px;padding:2px 1px;color:#5b5651}#ttip .tst span b{display:block;font-size:12px;color:#171619}
</style>
</head>
<body>
<div id="app">
  <!-- TITLE -->
  <div id="scr-title" class="screen on">
    <canvas id="titleCv" width="320" height="180"></canvas>
    <div class="logo"><div class="a">УЛИЧНЫЙ<br>ЧЕМПИОН</div><div class="b">КАРЬЕРА</div></div>
    <div class="menu">
      <button class="btn red" id="btnContinue" data-act="continue">Продолжить</button>
      <button class="btn grn" data-act="newgame">Новая карьера</button>
      <button class="btn" data-act="help">Как играть</button>
      <button class="btn" data-act="sound" id="btnSound">Звук: вкл</button>
      <button class="btn" data-act="vibro" id="btnVibro" style="display:none">Вибрация: вкл</button>
    </div>
    <div class="foot">5 районов · 50 боссов · 500 волн · 1 пояс<br><span id="build"></span><div id="saveInfo"></div></div>
  </div>

  <!-- HUB -->
  <div id="scr-hub" class="screen">
    <div class="top" id="topbar"></div>
    <div class="scroll" id="tabBody"></div>
    <div id="fightbar"></div>
    <nav class="nav" id="nav">
      <button data-act="tab" data-v="fighter"><span class="ic">🥊</span>Боец<i class="dot"></i></button>
      <button data-act="tab" data-v="gym"><span class="ic">🏋</span>Зал<i class="dot"></i></button>
      <button data-act="tab" data-v="moves"><span class="ic">👊</span>Приёмы<i class="dot"></i></button>
      <button data-act="tab" data-v="league"><span class="ic">🏆</span>Этапы<i class="dot"></i></button>
    </nav>
  </div>

  <!-- FIGHT -->
  <div id="scr-fight" class="screen">
    <div class="hud">
      <div class="side"><canvas class="face" id="pFace" width="128" height="128"></canvas><div class="sb"><div class="nmrow"><canvas class="nm" id="pName" width="10" height="10"></canvas></div><div class="bar hp" id="pHpBar"><i class="ghost" id="pGhost"></i><i class="fill" id="pHp"></i><b class="num" id="pHpN"></b></div><div class="strow"><div class="bar st"><i class="fill" id="pSt"></i></div><b class="stn" id="pStN"></b></div></div></div>
    </div>
    <div class="awrap" id="arena"><canvas id="fightCv" width="320" height="180"></canvas><div id="fx"></div><canvas id="banner" width="10" height="10"></canvas><canvas id="bigfx" width="10" height="10"></canvas><div class="ftimer"><small id="fRound">ВОЛНА</small><span id="fTimer">30</span></div></div>
    <div class="hud ohud">
      <div class="side r"><div class="sb"><div class="nmrow"><canvas class="nm" id="oName" width="10" height="10"></canvas></div><div class="bar hp" id="oHpBar"><i class="ghost" id="oGhost"></i><i class="fill" id="oHp"></i><b class="num" id="oHpN"></b></div><div class="strow"><b class="stn" id="oStN"></b><div class="bar st"><i class="fill" id="oSt"></i></div></div></div><canvas class="face" id="oFace" width="128" height="128"></canvas></div>
    </div>
    <div class="fctl">
      <div class="waves" id="waveTrack"></div>
      <div class="runinfo" id="runInfo"></div>
      <div class="flog" id="flog"></div>
      <div class="adr" id="adrRow">АДРЕНАЛИН<div class="bar"><i class="fill" id="pAdr"></i></div><b class="cmb" id="comboMul"></b></div>
      <div class="rrow"><button class="btn rage" id="rageBtn" data-act="rage">🔥 ЯРОСТЬ</button><button class="cbtn" data-act="cons" data-v="med"></button><button class="cbtn" data-act="cons" data-v="band"></button><button class="cbtn" data-act="cons" data-v="nrg"></button></div>
      <div id="cmbHint"></div>
      <div class="chips" id="fChips"></div>
      <div class="hint" id="fHint">Боец дерётся сам. Раз в 5 с над кнопками — связка из 3 приёмов: нажми по порядку — мощный комбо-удар.</div>
      <div class="frow f3"><button class="btn sm" id="speedBtn" data-act="speed">⏩ x1</button><button class="btn sm" id="autoBtn" data-act="auto">Авто: выкл</button><button class="btn sm" data-act="surrender">Отступить</button></div>
    </div>
  </div>

  <!-- TRAINING -->
  <div id="train" class="modal"><div class="mbox">
    <div class="title" id="trTitle" style="color:var(--yel)">ТРЕНИРОВКА</div>
    <canvas id="trCv" width="240" height="135"></canvas>
    <div class="trinfo"><span id="trTaps">Подходы: 0</span><span id="trTime">3.0 c</span></div>
    <div class="bar" style="height:12px"><i id="trBar" style="background:var(--cyan);width:100%"></i></div>
    <div class="gap"></div>
    <div class="dim" id="trMsg" style="text-align:center;min-height:36px"></div>
    <div class="gap"></div>
    <button class="btn" id="trClose" data-act="trclose">Закрыть</button>
  </div></div>

  <div id="modal" class="modal"><div class="mbox" id="mbox"></div></div>

  <!-- РЕКЛАМА: окно для рекламы за награду («Второе дыхание», «×2 награда») -->
  <div id="ad" class="modal"><div class="mbox">
    <div class="title" style="color:var(--org);font-size:18px">📺 РЕКЛАМА</div>
    <!-- ▼▼▼ СЮДА ВСТАВЛЯЕТСЯ HTML-БАННЕР / ВИДЕО РЕКЛАМОДАТЕЛЯ ▼▼▼ -->
    <div id="adSlot"></div>
    <!-- ▲▲▲ КОНЕЦ МЕСТА ДЛЯ РЕКЛАМЫ ▲▲▲ -->
    <div class="gap"></div>
    <div class="dim" id="adTimer" style="text-align:center"></div>
    <div class="gap"></div>
    <button class="btn grn" id="adClaim" data-act="adclaim" disabled>Получить награду</button>
    <div class="gap"></div>
    <button class="btn" data-act="adcancel">Закрыть без награды</button>
  </div></div>
  <div id="ttip" aria-hidden="true"></div><div id="toast"></div>
  <div id="tip"></div>
  <div id="rotate"><div>📱 ↻<br>Поверните телефон вертикально</div></div>
  <div id="diag"></div>
</div>

const startMv=h=>START_MV[h]||START_MV[1];
const mvOk=(id,s)=>{ s=s||S; return treeOn(s)||startMv(s.hero).includes(id); }; // приём можно взять в бой
// набор в бой — только доступные выученные приёмы, хотя бы один удар; пусто — первые доступные
function fixLoad(s){ const ok=s.owned.filter(m=>MOVES[m]&&mvOk(m,s)); s.load=[...new Set(s.load.filter(m=>ok.includes(m)))].slice(0,3); if(!s.load.length) s.load=ok.slice(0,3);
  if(!s.load.some(m=>MOVES[m].type==='atk')){ const a=ok.find(m=>MOVES[m].type==='atk'); if(a) s.load=[a,...s.load].slice(0,3); } }
const schOpen=(h,k,s)=>k===0||schSpent(h,k-1,s)>=SCH_OPEN;
const schoolOf=h=>{ const t=TREE[h]||TREE[1], k=hsOf(h).sch; return t[k]&&schOpen(h,k)?t[k]:t[0]; }; // активная школа бойца
const treeMoves=(h,s)=>[0,1,2].flatMap(k=>TREE[h][k].nodes.filter(n=>n.mv&&nodeR(h,n.id,s)>0).map(n=>n.mv));
const baseMoves=h=>[...new Set([...startMv(h),...(SCHOOLS[h]||SCHOOLS[1]).moves.map(m=>m[0])])]; // сборка 138: стартовые — первыми
const schoolMoves=(h,s)=>[...new Set([...baseMoves(h),...treeMoves(h,s)])];
const eachNode=(h,fn)=>{ if(!treeOn()) return; /* сборка 138: до LVL_CAP узлы не действуют */ for(const sc of TREE[h]) for(const n of sc.nodes){ const r=nodeR(h,n.id); if(r) fn(n,r); } };
function applyTree(f){ eachNode(S.hero,(n,r)=>{ if(n.a) n.a(f,r); }); }
function applyDebuffs(o){ const sc=schoolOf(S.hero); if(treeOn()&&sc.odeb) sc.odeb(o); eachNode(S.hero,(n,r)=>{ if(n.deb) n.deb(o,r); }); }
const treePm=()=>{ let k=1; eachNode(S.hero,(n,r)=>{ k*=Math.pow(n.pm||1,r); }); return k; };
const mvEntry=(id,h)=>(SCHOOLS[h===undefined?S.hero:h]||SCHOOLS[1]).moves.find(m=>m[0]===id);

  if(k<0){ r*=1+k; g*=1+k; b*=1+k; } else { r+=(255-r)*k; g+=(255-g)*k; b+=(255-b)*k; }
  return '#'+((1<<24)|(Math.round(r)<<16)|(Math.round(g)<<8)|Math.round(b)).toString(16).slice(1);
}
function mix(a,b,k){
  const A=parseInt(a.slice(1),16), B=parseInt(b.slice(1),16), f=(s)=>Math.round(((A>>s)&255)*(1-k)+((B>>s)&255)*k);
  return '#'+((1<<24)|(f(16)<<16)|(f(8)<<8)|f(0)).toString(16).slice(1);
}

const LOSS_XP=0.3, lossPct=k=>String(Math.round(k*LOSS_XP*1000)/10).replace('.',',');
const xpPay=i=>Math.round(OPP[i].xp*(i<S.beaten?REPEAT_XP:1)*seasonXp()*xpK(i)), REPEAT_XP=.5; // повтор пройденного — вдвое меньше опыта

   начало как раньше, 50-й уровень — к концу первого круга (≈ этапы 42–50). После LVL_CAP и в кругах 2+ — ×1 (опыт идёт в очки дерева). Деньги не меняются. */

const perkDue=R=>PERK_WAVES.includes(R.wave)&&!R.perkAt.includes(R.wave);
const perkMiss=R=>PERK_WAVES.filter(w=>w<R.from&&!R.perkAt.includes(w)); // сборка 117: усиления волн, пропущенных стартом с контрольной точки
function rollPerks(no){ const ids=Object.keys(PERKS).filter(k=>k!==no); for(let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; } return ids.slice(0,3); } // no — без этого усиления (сборка 117: аптечка на старте с полным здоровьем бесполезна)

let PERK_T=0, PERK_OPT=[];

function enemyDown(l){

  S.money+=m; S.kills++; const ups=addXp(x);
  if(Math.random()<GEAR_DROP){ const it=rollGear(F.idx,false); F.loot.push(giveGear(it)); floatTxt(F.p,'🎁 '+SLOTS[it.s].ic,gearCol(it),true); addLog('<b style="color:'+gearCol(it)+'">Добыча: '+gearName(it)+'</b>'); }
  save();

}
function nextWave(){

  if(!boss){ const txt='ВОЛНА '+F.wave; showBanner(txt); setTimeout(()=>{ if(F&&F.banner===txt) hideBanner(); },900); }

function renderWaves(){

  h+='<i class="boss'+(isBoss()?(lost?' lost':F.winner==='p'?' done':' cur'):'')+'">БОСС</i>';

function addLog(m){ if(F.sim) return; F.log.unshift(m); F.log.length=Math.min(F.log.length,2); $('#flog').innerHTML=F.log.map(x=>'<div>'+x+'</div>').join(''); }

  d.style.left=clamp((f.x+rnd(-6,6)-FV.x)/FV.w*100,12,88)+'%'; d.style.top=((GROUND-80+rnd(-6,6))/H*100)+'%';

function sparks(x,y,n,colors){ if(F.sim) return; for(let i=0;i<n;i++) F.parts.push({x,y,vx:rnd(-1.6,1.6),vy:rnd(-2,.4),life:rnd(200,450),s:Math.random()<.3?2:1,c:colors[i%colors.length]}); }
function chooseMove(f,o){
  const opts=f.moves.filter(id=>MOVES[id]&&MOVES[id].sta<=f.sta);
  const atk=opts.filter(id=>MOVES[id].type==='atk');
  if(!atk.length && (opts.length===0 || Math.random()<.6)) return null; // нет сил — отдышаться
  const hpR=f.hp/f.maxHp, staR=f.sta/f.maxSta; let tot=0; const w=[];
  for(const id of opts){
    const m=MOVES[id]; let k;
    if(m.type==='atk'){
      k=1+m.dmg/10;
      if(o.stance==='block') k*=.4+m.pierce*2;
      if(o.hp/o.maxHp<.25) k*=1+m.dmg/12;
      if(staR<.35) k/=1+m.sta/6;
    } else {
      k=.55;
      if(o.pending) k+=.9;
      if(hpR<.35) k*=1.4;
      if(f.stance) k*=.3;
      if(id==='dodge') k*=.6+f.st.agi*.06;
    }
    w.push(k); tot+=k;
  }
  let r=Math.random()*tot;
  for(let i=0;i<opts.length;i++){ r-=w[i]; if(r<=0) return opts[i]; }
  return opts[opts.length-1];
}
function act(f,o){
  const id=chooseMove(f,o);
  if(!id){ f.pose='tired'; f.poseT=700; f.sta=Math.min(f.maxSta,f.sta+12+f.st.end); f.timer=900; f.cur=null; f.stance=null; f.stanceT=0;
    if(f.isPlayer||Math.random()<.5) addLog(f.name+(f.isPlayer?' переводишь дух…':' переводит дух…')); return; }
  const m=MOVES[id]; f.cur=id; f.sta-=m.sta;
  const base=intervalOf(f.st)*m.spd*(f.haste||1)*(raging(f)?RAGE_HASTE:1);
  if(m.type==='def'){ f.stance=id; f.stanceT=m.dur; f.pose=id; f.poseT=0; f.timer=base; }
  else { f.stance=null; f.stanceT=0; f.pending={m:id,t:200}; f.pose=windPose(PZ(id)); f.poseT=0; f.timer=base+200; }
}
function startSuper(f){
  f.adr=0; f.stance=null; f.stanceT=0; f.pending={m:'super',t:260}; f.pose=windPose('super'); f.poseT=0; f.cur='super';
  f.timer=intervalOf(f.st)+260; F.flashAll=.5; sfx('super');
  floatTxt(f,'СУПЕР!','#ffd23f',true); bigFx('СУПЕРУДАР!','#ffd23f'); addLog('<b style="color:#ffd23f">'+f.name+': СУПЕРУДАР!</b>');

function resolveAttack(a,d,id,cb){ // cb — множитель комбо-удара (удар не блокируется и не промахивается)
  const isSup=id==='super', m=isSup?SUPER:MOVES[id], sure=isSup||!!cb;
  a.smearFrom=a.pose; a.pose=isSup?'super':PZ(id); a.poseT=isSup?450:280; a.smear=90; // смаз руки на первых кадрах удара
  let second=false; if(m.multi>1&&!isSup){ if(a.mh){ a.mh=0; second=true; } else { a.mh=1; a.nextHit={m:id,t:150}; } } // «двойка»: второй удар через 0,15 с
  if(m.multi) a.pose=second?'cross':'jab';
  const pz=PZ(id), hx=d.x-d.face*3, hy=GROUND-(pz==='uppercut'||pz==='highkick'?54:pz==='lowkick'?24:pz==='midkick'||pz==='knee'?38:50);
  if(d.stance==='dodge'&&!sure){
    if(Math.random()<clamp(dodgeOf(d.st)-a.st.spd*.008,.2,.85)){
      d.stance=null; d.stanceT=0; d.pose='dodge'; d.poseT=320; if(!d.pending) d.timer=Math.min(d.timer,220);
      floatTxt(d,'УКЛОН','#38e8ff'); sfx('whiff'); addLog(d.name+' уходит от удара!'); return;
    }
  }
  const acc=sure?1:clamp(m.acc+(a.st.spd-d.st.spd)*.012+a.st.agi*.004+(a.accB||0),.35,.97);
  if(Math.random()>acc){ floatTxt(d,'МИМО','#9a8cc0'); sfx('whiff'); return; }
  if(!sure&&d.evade&&Math.random()<d.evade){ d.pose='dodge'; d.poseT=260; floatTxt(d,'УКЛОН','#38e8ff'); sfx('whiff'); return; } // усиление «Скользкий»
  let dmg=m.dmg*(1+a.st.str*.13)*a.dm*rnd(.88,1.12)*(raging(a)?RAGE_DMG:1)*(cb||1)*(m.counter&&(d.pending||ATK_POSES.has(d.pose))?m.counter:1); // комбо-удар, контрудар
  const crit=!isSup&&Math.random()<Math.min(CRIT_CAP,critOf(a.st)+(a.critB||0)); if(crit) dmg*=1.6;

  if(a.vamp&&a.hp>0) a.hp=Math.min(a.maxHp,Math.round(a.hp+dmg*a.vamp));
  d.flash=blocked?.35:.85; d.push=blocked?2:(crit||isSup||m.dmg>=11?8:4);
  if(!blocked){ d.pose='hit'; d.poseT=230; if(!d.pending) d.timer+=160; }
  F.shake=Math.max(F.shake,blocked?1:(crit||isSup?6:m.dmg>=11?4:2)); // сборка 126: толпа ликует только при нокауте от игрока (не на каждый удар)
  a.adr=Math.min(100,a.adr+(blocked?3:7)*(a.adrK||1)); d.adr=Math.min(100,d.adr+(blocked?1:5)*(d.adrK||1));
  sparks(hx,hy,blocked?5:crit||isSup?16:9,blocked?['#9fe0ff','#fff']:['#fff','#ffd23f','#ff8a2b']);
  if(!F.sim){ F.fx.push({x:hx,y:hy,t:0,life:blocked?140:200,type:blocked?'block':'hit',big:crit||isSup||m.dmg>=11,dir:d.face});
    F.hitstop=Math.max(F.hitstop,blocked?45:crit||isSup?140:m.dmg>=11?100:70); } // стоп-кадр: удар «чувствуется»
  if(cb&&!F.sim){ F.shake=Math.max(F.shake,7); F.hitstop=Math.max(F.hitstop,170); F.flashAll=.5; sparks(hx,hy,18,['#fff','#38e8ff','#9fe0ff']); }
  if(crit&&!cb&&!isSup&&!blocked) bigFx('КРИТ!','#ff5a6a');

  sfx(blocked?'block':(crit||isSup)?'crit':'hit');
  if(!blocked&&(crit||isSup||Math.random()<.35)) addLog(a.name+': '+m.n.toLowerCase()+(crit?' — критический!':'')+' ('+dmg+')');
  if(d.hp<=0) ko(a,d);
}
function ko(w,l){

    }

function updateFighter(f,o,dt){

  if(f.stanceT>0){ f.stanceT-=dt; if(f.stanceT<=0){ f.stance=null; f.stanceT=0; if(f.pose==='block'||f.pose==='dodge') f.pose='idle'; } }
  if(f.poseT>0){ f.poseT-=dt; if(f.poseT<=0){ f.poseT=0; const wasAtk=ATK_POSES.has(f.pose);
    f.pose=f.pending?windPose(PZ(f.pending.m)):wasAtk?(/kick|knee/.test(PZ(f.cur||''))?'kickrec':'recover'):(f.stance||'idle'); if(wasAtk&&!f.pending) f.poseT=/kick|knee/.test(PZ(f.cur||''))?150:90; } } // после удара ногой — возврат через замах

  S.money+=money; const ups=addXp(xp)+F.earn.ups;

  // если на новый этап не хватает энергии — авто фармит последний пройденный (это бесплатно)

  $('#trClose').style.display='none';

// автотренировка: боец сам делает подходы, ничего нажимать не нужно
function trainRep(){
  TR.taps++; sfx('tap'); $('#trTaps').textContent='Подходы: '+TR.taps;
  TR.anim++; TR.poseT=150;
  if(TR.k==='str'){ TR.pose='jab'; TR.bagV+=.06; }
  else if(TR.k==='spd'){ TR.pose='jump'; }
  else if(TR.k==='end'){ TR.pose=TR.anim%2?'run1':'run2'; TR.poseT=260; }
  else { TR.pose='dodge'; TR.ball=1; }
}
function updateTrain(dt){
  if(!TR) return;
  TR.bagV-=TR.bag*.004*dt; TR.bagV*=Math.pow(.2,dt/1000); TR.bag+=TR.bagV*dt/16; TR.bag=clamp(TR.bag,-.5,.5);
  if(TR.poseT>0){ TR.poseT-=dt; if(TR.poseT<=0) TR.pose=TR.k==='spd'?'stand':TR.k==='end'?'run1':'idle'; }
  TR.ball=Math.max(0,TR.ball-dt/300);
  if(TR.state==='run'){
    TR.t+=dt; TR.time-=dt; TR.tick-=dt; if(TR.tick<=0){ TR.tick=6*TR_FR; trainRep(); } // подход — полный круг из 6 кадров $('#trTime').textContent=Math.max(0,TR.time/1000).toFixed(1)+' c'; $('#trBar').style.width=Math.max(0,TR.time/TRAIN_TIME*100)+'%';
    if(TR.time<=0) finishTrain();
  }
}
function finishTrain(){
  TR.state='done'; TR.t=0; const k=TR.k; // после подходов — стойка (кадр 1)
  const hard=S.trMode==='hard', gain=Math.round(70*trainMult()*(hard?TRAIN_HARD_K:1)); if(hard) S.tired=true; // интенсивная — с усталостью
  const before=S.st[k], ups=addProg(k,gain), lv=addXp(5); taskAdd('train');
  save();
  let msg='Прогресс «'+STATS[k].n+'»: <b style="color:var(--cyan)">+'+gain+'</b> · +5 XP'+(hard?'<br><span style="color:var(--org)">😮‍💨 Усталость: −15% здоровья в следующем забеге</span>':'');
  if(ups) msg+='<br><b style="color:var(--grn)">'+STATS[k].n+' '+before+' → '+S.st[k]+'!</b>';
  else msg+='<br>До следующего очка: '+(needProg(S.st[k])-S.prog[k]);
  if(lv) msg+='<br><b style="color:var(--yel)">Новый уровень '+S.lvl+'! '+lvlGain(lv)+'</b>';
  $('#trMsg').innerHTML=msg;

function closeTrain(){
  if(!TR) return;
  if(TR.state==='run') return;

}

const AD_CONFIG={
  stubSeconds:5   // длительность заглушки, пока реклама не подключена

let AD=null;
function closeAdOverlay(){ if(AD) clearInterval(AD.timer); $('#ad').classList.remove('on'); $('#adSlot').innerHTML=''; AD=null; }
function showRewardedAd(onReward){
  if(AD) return;
  let done=false;
  // reward() — вызвать, когда реклама досмотрена; cancel() — если закрыта раньше или произошла ошибка
  const reward=()=>{ if(done) return; done=true; closeAdOverlay(); onReward(); };
  const cancel=msg=>{ if(done) return; done=true; closeAdOverlay(); toast(msg||'Реклама не досмотрена — награды нет'); };
  AD={reward,cancel,timer:0,left:Infinity};

  /* ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼ ВСТАВЬТЕ КОД РЕКЛАМОДАТЕЛЯ ЗДЕСЬ ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
     Покажите рекламу и по её итогу вызовите reward() или cancel(), затем return.
     SDK рекламной сети подключается тегом <script> в <head> (игра тогда потребует интернет).

     Пример — Яндекс Игры (rewarded video):
       ysdk.adv.showRewardedVideo({callbacks:{
         onRewarded:()=>reward(),
         onClose:()=>cancel(),
         onError:()=>cancel('Реклама недоступна, попробуй позже')
       }}); return;

     Пример — Google H5 Games Ads:
       adBreak({type:'reward',name:'sleep',
         beforeReward:show=>show(), adViewed:()=>reward(), adDismissed:()=>cancel(),
         adBreakDone:()=>cancel('Реклама недоступна, попробуй позже')}); return;

     Пример — свой баннер/видео в окне: положите HTML в $('#adSlot').innerHTML
     и удалите блок заглушки ниже, оставив таймер и кнопки.
     ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ КОНЕЦ ВСТАВКИ ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ */

  // Заглушка: показывает окно-плейсхолдер с обратным отсчётом (работает офлайн)
  $('#adSlot').innerHTML='<div class="adstub"><b>ЗДЕСЬ БУДЕТ РЕКЛАМА</b>Место для баннера или видео рекламодателя</div>';
  AD.left=AD_CONFIG.stubSeconds;
  const tick=()=>{
    if(!AD) return;
    $('#adTimer').textContent=AD.left>0?'Награда через '+AD.left+' c…':'Можно забрать награду!';
    $('#adClaim').disabled=AD.left>0;
    AD.left--;
    if(AD.left<-1) clearInterval(AD.timer);
  };
  tick(); AD.timer=setInterval(tick,1000);
  $('#ad').classList.add('on');
}
